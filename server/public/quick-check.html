// Sweep-reversal watch (2026-08-25) -- shows the most recent SWEEP_REVERSAL_LONG/SHORT_
// OVERNIGHT fire today, regardless of the live/all timeline toggle, since this mechanism
// is SHADOW-only by design and would otherwise never surface here at all (the toggle
// defaults to 'live' = origin_status==='ACTIVE' only). Uses setup_type directly, not
// origin_status, to find it -- deliberately independent of whichever fires happen to also
// clear the unrelated live-eligibility bar. Built via textContent, not innerHTML -- setup_type
// ultimately comes from a config array, not free user input, but no reason to be the one
// place on this page that breaks the pattern.
// Manual dismiss (2026-09-07, user request: a resolved trade sitting here mislabeled
// "WATCHING" for up to 2 hours was confusing) -- keyed by active_setups.id so a genuinely
// NEW fire (different id) always overrides a dismissal of the previous one. Persisted so a
// page reload doesn't un-dismiss it.
let sweepWatchDismissedId = localStorage.getItem('sweepWatchDismissedId');

function renderSweepWatch() {
  const el = $('sweep-watch');
  // Exact suffix match, not a bare .includes('SWEEP_REVERSAL') -- FAILED_SWEEP_REVERSAL_
  // LONG/SHORT is a real, unrelated, pre-existing setup type (Setup B from the 2026-08-10
  // roster rebuild) that a loose substring match collides with. Caught live via a
  // Playwright check before shipping: this exact collision made the card show FAILED_
  // SWEEP_REVERSAL fires mislabeled as the brand-new mechanism.
  const SWEEP_REVERSAL_RE = /_SWEEP_REVERSAL_(LONG|SHORT)_OVERNIGHT$/;
  const hit = [...allTimelineRows].reverse().find(s => SWEEP_REVERSAL_RE.test(s.setup_type || ''));
  if (!hit || String(hit.id) === sweepWatchDismissedId) { el.className = ''; el.textContent = ''; return; }

  const isLong = (hit.setup_type || '').includes('_LONG_');
  const levelName = (hit.setup_type || '').replace(/_SWEEP_REVERSAL_(LONG|SHORT)_OVERNIGHT$/, '').replace(/_/g, ' ');
  const resolved = hit.resolution && hit.resolution !== null;
  const pnl = hit.actual_pnl != null ? Number(hit.actual_pnl) : null;

  // Auto-hide once resolved and stale (2026-09-02, user-reported: this card sat showing the
  // same closed trade for hours since this mechanism fires rarely and there's nothing to
  // replace it). Compares two timestamps built the SAME way (both derived from a naive
  // "YYYY-MM-DD HH:MM:SS" ET-wall-clock string parsed via the browser's local Date parser --
  // matching currentSessionDateET()'s existing nowET pattern above) so the elapsed-minutes
  // math is correct regardless of the viewing device's own timezone. 120 min is a display-only
  // cutoff (how long a closed trade stays visible), not a trading threshold, so it's a
  // documented fixed choice -- same precedent as this file's 15-minute cluster-dedup window.
  const SWEEP_WATCH_HIDE_AFTER_MIN = 120;
  if (resolved && hit.resolved_at_str) {
    const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const resolvedET = new Date(hit.resolved_at_str.replace(' ', 'T'));
    const staleMins = (nowET - resolvedET) / 60000;
    if (staleMins > SWEEP_WATCH_HIDE_AFTER_MIN) { el.className = ''; el.textContent = ''; return; }
  }

  el.textContent = '';
  const head = document.createElement('div');
  head.className = 'setup-head';
  const tag = document.createElement('span');
  tag.className = 'sweep-watch-tag';
  // Resolution-aware label -- previously always said "WATCHING" even once a trade had
  // already closed (the exact confusion a user screenshot flagged 2026-09-07: a card
  // showing "Result: STOP HIT ($-92)" still tagged as if still being tracked).
  tag.textContent = 'SWEEP REVERSAL · ' + (resolved ? 'CLOSED' : 'WATCHING');
  const typeSpan = document.createElement('span');
  typeSpan.className = 'setup-type';
  typeSpan.style.color = isLong ? 'var(--green)' : 'var(--red)';
  typeSpan.style.flex = '1';
  typeSpan.textContent = levelName + ' ' + (isLong ? 'LONG' : 'SHORT');
  head.appendChild(tag);
  head.appendChild(typeSpan);
  // Manual dismiss -- only offered once resolved (an open/watching trade shouldn't be
  // hideable, there's nothing yet to replace it with). Same 2026-09-07 request.
  if (resolved) {
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '×';
    closeBtn.setAttribute('aria-label', 'Dismiss');
    closeBtn.style.cssText = 'background:none;border:none;color:var(--dim);font-size:18px;line-height:1;padding:0 2px;cursor:pointer;flex-shrink:0;';
    closeBtn.onclick = () => {
      sweepWatchDismissedId = String(hit.id);
      localStorage.setItem('sweepWatchDismissedId', sweepWatchDismissedId);
      renderSweepWatch();
    };
    head.appendChild(closeBtn);
  }
  el.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'setup-grid';
  const addCell = (label, value, color) => {
    const span = document.createElement('span');
    span.className = 'k';
    span.textContent = label + ' ';
    const b = document.createElement('b');
    b.className = 'mono';
    if (color) b.style.color = color;
    b.textContent = value;
    span.appendChild(b);
    grid.appendChild(span);
  };
  if (hit.entry_zone_low != null) addCell('Entry', Math.round(hit.entry_zone_low), 'var(--text)');
  if (hit.stop_level != null) addCell('Stop', Math.round(hit.stop_level), 'var(--red)');
  if (hit.t1_level != null) addCell('T1', Math.round(hit.t1_level), 'var(--green)');
  if (resolved) addCell('Result', hit.resolution.replace(/_/g, ' ') + (pnl != null ? ' (' + (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(0) + ')' : ''), pnl >= 0 ? 'var(--green)' : 'var(--red)');
  el.appendChild(grid);

  const note = document.createElement('div');
  note.className = 'sweep-watch-note';
  note.textContent = 'Fired because price broke decisively through ' + levelName + ' overnight, then this mechanism bet on a reversal. Brand new (2026-08-25) — tracked like a real trade, but not yet a trusted signal. Never shows here unless it actually fires.';
  el.appendChild(note);

  el.className = 'visible';
}

function setTimelineFilter(f) {
  timelineFilter = f;
  localStorage.setItem('timelineFilter', f);
  renderTimeline();
}

// Globex-watch toggle (2026-09-16, user request, added the same session Globex firing was
// paused): a THIRD, fully INDEPENDENT toggle -- deliberately not a third value on
// timelineFilter, because the user explicitly does not want this to touch the Live/All-driven
// Performance stats (Wins/Losses/Net P&L/Gross/Comm/Worst Trade) at all. Those stay computed
// from `resolved` (the normal timelineFilter-based set) unconditionally, regardless of this
// toggle's state -- see renderTimeline()'s own comment at the point it branches on
// `globexWatch` for exactly where the two paths split.
let globexWatch = localStorage.getItem('globexWatch') === 'true';
function setGlobexWatch(on) {
  globexWatch = on;
  localStorage.setItem('globexWatch', String(on));
  renderTimeline();
}

function renderTimeline() {
  const sessionDate = currentSessionDateET();
  // FIXED 2026-08-09: was showing every date /api/setups/today returned (today's RTH date
  // AND, once >=6PM ET, tomorrow's Globex date simultaneously) -- see currentSessionDateET()
  // above for the full writeup. Now scoped to the ONE session that's actually open.
  //
  // live/all toggle (added 2026-08-09, user request): 'live' = origin_status==='ACTIVE' --
  // rows that were actually shown as a real, actionable alert at the moment they fired.
  // 'all' includes SHADOW-at-fire rows too (background-tracked touches: cascade-breaker
  // audit rows, suppressed/uncalibrated candidates, cluster-dedup audit entries -- all real
  // price events the system tracked, none of them ever surfaced to the user as a trade to
  // take). CORRECTED same session: originally built a new `fired_status` column for this
  // before realizing `origin_status` (added 2026-07-17) already IS it -- every live-firing
  // INSERT site binds origin_status to the exact same ACTIVE/SHADOW value as `status` at
  // insert time, so a second column was pure duplication, and using the existing one is
  // strictly better since it's already populated back to 2026-07-17, not just from today.
  // Rows with origin_status IN ('BACKFILL','UNKNOWN') or null are excluded from 'live'
  // (genuinely never shown as a real alert, not just "unknown") and included in 'all'.
  const scoped = allTimelineRows.filter(s => s.trade_date === sessionDate);
  const resolved = scoped
    // stale_entry_price_basis (2026-09-15, OPEN_DECISION
    // contract_calendar_roll_race_stale_price_20260915/globex_vwap_fade_stale_price_after_
    // restart_20260914): rows confirmed to have a corrupted entry price (a real historical
    // bar days old, not the actual price at fired_at). /api/setups/today returns raw rows
    // with no server-side filter -- this endpoint's own backend sibling (/api/setups/
    // range-summary, feeding the Performance card below) already excludes these via the
    // shared REAL_TRADE_FILTER; this client-side filter is this card's own equivalent so
    // Net P&L/Wins/Losses/Worst Trade don't keep re-displaying a known-corrupted trade.
    .filter(s => !s.stale_entry_price_basis)
    .filter(s => s.fired_at_str && s.status !== 'SHADOW' && s.status !== 'ACTIVE')
    .filter(s => timelineFilter === 'all' || s.origin_status === 'ACTIVE')
    .filter(s => tagFilter === 'all' || TAG_META[tagFilter]?.test(s))
    // Globex omitted from the main timeline entirely (2026-09-16, user request, same session
    // Globex firing was paused) -- unconditional, not tied to the globexWatch toggle below, so
    // it stays out of both the row list AND Performance/timeline-stats regardless of Live/All.
    // Globex's own rows live exclusively under the separate "🌙 Globex" tab (globexRows below).
    .filter(s => isRthAdjacent(s))
    .sort((a, b) => (b.fired_at_str || '').localeCompare(a.fired_at_str || ''));
  timelineRows = resolved;

  // Reuses computeRangeStats() (defined below, hoisted) for wins/losses/netPnl/grossPnl/
  // commission -- per this codebase's "share modules instead of reimplementing" convention,
  // same population/sort as the Performance section below.
  const rangeStats = computeRangeStats(resolved);
  const { wins, losses, netPnl, grossPnl, commission } = rangeStats;

  // Max single-trade drawdown (2026-08-31, user correction): computeRangeStats()'s maxDD is
  // the CUMULATIVE peak-to-trough across the whole session's equity curve (the prop-account
  // DLL-risk figure already shown in Performance) -- user explicitly wants a DIFFERENT number
  // here: the worst adverse excursion within any ONE trade today, not the multi-trade
  // sequence. mae_points is already the real bar-by-bar worst-adverse-price-move captured per
  // trade (same field the modal's "MAE" row reads) -- converted to dollars at $2/pt (MNQ,
  // matches COMMISSION_PER_TRADE's own header comment) since MAE itself is never commission-
  // adjusted (it's a pre-exit price excursion, not a realized fill).
  //
  // Scaled by size_multiplier (2026-08-31, user wants "actual risk" not flat 1x): each
  // active_setups row already carries the system's own live sizing recommendation at fire
  // time (baseline 1.0, scaled 0.10-1.5x -- the sizeMultiplier IIFE in acd.js, CLAUDE.md's
  // "Level fade alpha engine" section). This is deliberately NOT trades.quantity (the real,
  // manually-reconciled broker-fill table) -- there's no established, validated join from an
  // active_setups row to a specific real trade's contract count, and CLAUDE.md's own
  // collaboration rule is explicit that trades-table data must not be conflated with this
  // signal-firing engine without that link being established first. size_multiplier is the
  // one per-setup "how much was this actually sized to matter" figure this system itself
  // computes and trusts elsewhere (Alpha Engine overview, sizing displays).
  function worstTradeDD(rows) {
    let maxDD = 0;
    for (const s of rows) {
      if (s.mae_points == null) continue;
      const mult = s.size_multiplier != null ? Number(s.size_multiplier) : 1;
      const dd = Number(s.mae_points) * 2 * mult;
      if (dd > maxDD) maxDD = dd;
    }
    return maxDD;
  }
  const maxTradeDD = worstTradeDD(resolved);

  // Globex-watch rows -- computed regardless of globexWatch's current state (cheap, and the
  // toggle button below needs the count either way) but NEVER folded into `resolved`/
  // `rangeStats` -- those stay Live/All-driven and untouched, per the user's explicit ask.
  // Base filters mirror `resolved` (session-scoped, resolved, not stale-priced, respects the
  // Vol Building filter) but deliberately NOT the timelineFilter live/all restriction --
  // Globex is now paused (force-SHADOW, see acd.js's GLOBEX_PAUSED override), so a Globex-only
  // view restricted to origin_status='ACTIVE' would always be empty.
  const globexRows = scoped
    .filter(s => !s.stale_entry_price_basis)
    .filter(s => s.fired_at_str && s.status !== 'SHADOW' && s.status !== 'ACTIVE')
    .filter(s => !isRthAdjacent(s))
    .filter(s => tagFilter === 'all' || TAG_META[tagFilter]?.test(s))
    .sort((a, b) => (b.fired_at_str || '').localeCompare(a.fired_at_str || ''));
  const displayRows = globexWatch ? globexRows : resolved;

  $('timeline-title').textContent = (globexWatch ? 'Globex Watch (' : 'Session Timeline (') + displayRows.length + ')';
  $('timeline-head').querySelector('#timeline-toggle')?.remove();
  const toggle = document.createElement('div');
  toggle.id = 'timeline-toggle';
  toggle.style.cssText = 'display:flex;gap:1px;border-radius:6px;overflow:hidden;border:1px solid var(--border);';
  toggle.innerHTML = [['live', 'Live'], ['all', 'All']].map(([val, label]) =>
    '<button data-tf="' + val + '" style="padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;border:none;' +
    'background:' + (timelineFilter === val ? 'rgba(51,65,85,0.6)' : 'rgba(15,23,42,0.8)') + ';' +
    'color:' + (timelineFilter === val ? 'var(--text)' : 'var(--dim)') + '">' + label + '</button>'
  ).join('')
  // Globex-watch button -- visually separated (margin-left) from the Live/All pair since it's
  // an independent toggle, not a third value in that same group. Count shown inline so it's
  // obvious there's something to look at even before tapping it.
  + '<button data-gw="' + (globexWatch ? 'off' : 'on') + '" style="margin-left:4px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;border:none;' +
    'background:' + (globexWatch ? 'rgba(147,51,234,0.30)' : 'rgba(15,23,42,0.8)') + ';' +
    'color:' + (globexWatch ? '#d8b4fe' : 'var(--dim)') + '">🌙 Globex (' + globexRows.length + ')</button>';
  $('timeline-head').appendChild(toggle);
  // Click handled via delegation below (document-level listener) -- NOT attached per-button here.
  // These buttons are recreated by innerHTML on every 20s loadTimeline() poll; a listener bound
  // directly to a button can be destroyed mid-tap if a poll lands between touchstart and click,
  // silently swallowing the tap (found live 2026-08-28, user reported "I see it but can't click
  // on it" on the vol-building toggle -- same risk applies here, fixed for both at once).

  // Top-5-by-$-impact tag filter (2026-09-16, replaced Vol Building) -- pure display filter,
  // never affects firing. Counts shown per option so it's obvious how much data exists at each
  // bar before clicking. No label text (user request: "remove these words") -- just the
  // buttons, "All" plus one per top-5-ranked tag from loadTagRanking().
  const scopedForTags = s => s.fired_at_str && s.status !== 'SHADOW' && s.status !== 'ACTIVE' && (timelineFilter === 'all' || s.origin_status === 'ACTIVE') && isRthAdjacent(s);
  const tagOptions = [['all', 'All', scoped.filter(scopedForTags).length]]
    .concat(topTagKeys.map(key => [key, TAG_META[key].label, scoped.filter(s => scopedForTags(s) && TAG_META[key].test(s)).length]));
  $('vb-filter-row').innerHTML = topTagKeys.length === 0 ? '' :
    '<div style="display:flex;gap:1px;border-radius:6px;overflow:hidden;border:1px solid var(--border);">' +
    tagOptions.map(([val, label, count]) =>
      '<button data-tag="' + val + '" style="padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;border:none;' +
      'background:' + (tagFilter === val ? 'rgba(59,130,246,0.25)' : 'rgba(15,23,42,0.8)') + ';' +
      'color:' + (tagFilter === val ? '#93c5fd' : 'var(--dim)') + '">' + label + ' (' + count + ')</button>'
    ).join('') + '</div>';
  // Click handled via delegation below (document-level listener) -- see comment on the
  // Live/All toggle above for why per-button listeners are unreliable here.

  // Stats shown are ENTIRELY independent per view (2026-09-16, user: "I want to track Globex
  // but totally separate") -- when globexWatch is on, every number below is recomputed from
  // globexRows alone via the same shared computeRangeStats()/worstTradeDD() helpers, never
  // blended with or falling back to the RTH-based rangeStats/maxTradeDD above. Without this,
  // the Globex row list would sit directly under RTH's own Wins/Losses/Net P&L, which reads as
  // if those numbers described the list below them when they don't.
  const shownStats = globexWatch ? computeRangeStats(globexRows) : rangeStats;
  const shownMaxDD = globexWatch ? worstTradeDD(globexRows) : maxTradeDD;
  $('timeline-stats').innerHTML =
    '<span>Wins <b style="color:var(--green)">' + shownStats.wins + '</b></span>' +
    '<span>Losses <b style="color:var(--red)">' + shownStats.losses + '</b></span>' +
    '<span>Net P&L <b style="color:' + (shownStats.netPnl >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (shownStats.netPnl >= 0 ? '+' : '') + '$' + shownStats.netPnl.toFixed(0) + '</b></span>' +
    '<span title="Gross P&L before commission">Gross <b class="mono" style="color:var(--muted)">' + (shownStats.grossPnl >= 0 ? '+' : '') + '$' + shownStats.grossPnl.toFixed(0) + '</b></span>' +
    '<span title="$' + COMMISSION_PER_TRADE + '/round-trip x ' + shownStats.n + ' resolved">Comm <b class="mono" style="color:var(--dim)">-$' + shownStats.commission.toFixed(0) + '</b></span>' +
    // Labeled "Worst Trade" (not "Max DD") -- 2026-09-08, user confusion found live: this page
    // ALSO has a real cumulative peak-to-trough "Max DD" in the Performance section below
    // (computeRangeStats().maxDD) that measures something completely different (the prop-
    // account DLL-risk figure across the whole sequence of trades) and is usually a much
    // bigger number. Reusing the same label for two different calculations on the same page
    // is exactly what caused the confusion -- see the tooltip for what THIS one actually is.
    '<span title="Worst adverse excursion (MAE) within any ONE trade today, scaled by that trade\'s own live sizing recommendation (size_multiplier) -- NOT the cumulative peak-to-trough (see Max DD in Performance below for that)">Worst Trade <b class="mono" style="color:' + (shownMaxDD > 0 ? 'var(--amber)' : 'var(--dim)') + '">-$' + shownMaxDD.toFixed(0) + '</b></span>';

  if (displayRows.length === 0) {
    // FIXED 2026-08-28 (DeepSeek code QA): this only checked timelineFilter, so filtering to
    // "Building"/"Strong" with zero matches showed "No live trades fired yet this session" even
    // when trades clearly had fired (visible in the stats above) -- read as the toggle being
    // broken rather than an honest "nothing matches this filter" message.
    const emptyMsg = globexWatch ? 'No Globex trades fired yet this session' :
      tagFilter !== 'all' ? 'No trades match this tag filter' :
      timelineFilter === 'live' ? 'No live trades fired yet this session' : 'Nothing fired yet this session';
    $('timeline-list').innerHTML = '<div class="loading">' + emptyMsg + '</div>';
    return;
  }

  // Extracted to a named function (2026-09-08) -- kept as its own function even now that every
  // row (cluster member or not) renders identically flat, since openClusterPopup() and the main
  // loop both benefit from one shared template.
  const rowHtml = (s) => {
    const rowPnl = s.actual_pnl != null ? parseFloat(s.actual_pnl) : null;
    const isWin = isWinRow(s);
    const isLoss = isLossRow(s);
    const badgeClass = isWin ? 'win' : isLoss ? 'loss' : 'other';
    const isTrail = s.resolution === 'TRAIL_EXIT';
    const badgeText = isTrail ? (isWin ? 'Trail ✓' : 'Trail ✗') :
      isWin ? 'T1 ✓' : isLoss ? 'Stop ✗' :
      (s.resolution === 'TIME_EXPIRED' || s.resolution === 'SESSION_CLOSED') ? 'expired' :
      s.resolution === 'INVALIDATED' ? 'inv.' : (s.status === 'ACTIVE' ? 'live' : '—');
    const isLong = (s.setup_type || '').includes('LONG') || (s.setup_type || '').includes('BULLISH');
    const dotColor = isLong ? 'var(--green-soft)' : 'var(--red-soft)';
    const time = s.fired_at_str ? s.fired_at_str.slice(11, 16) : '';
    const timeLabel = to12Hour(time);
    const price = s.entry_zone_low != null ? '@ ' + Number(s.entry_zone_low).toLocaleString(undefined, {maximumFractionDigits: 0}) : '';
    const vb = s.vol_building_signal;
    // Tap-to-popup added 2026-09-08 (user request: every tag should show this trade's P&L,
    // not just a hover tooltip) -- matches the sig-tag convention below (stopPropagation so
    // tapping doesn't also open the full trade modal). Deliberately does NOT show an aggregate
    // EV-by-volume-building-bucket number the way DirGate/MomFade's popups do: CLAUDE.md's own
    // volume-building research found a blanket EV split against the fade roster doesn't hold
    // (opposite-signed within-family results, "rejected as a blanket rule") -- fabricating one
    // here would be worse than showing nothing. Real per-trade P&L + the raw signal reading
    // only, same honesty bar as every other popup.
    const vbTag = vb?.agreesP60 ? '<span class="vb-tag strong sig-tag" title="Both volume measures agree, above the tighter p60 cutoff -- tracking only, not yet validated" onclick="event.stopPropagation(); openVolBuildingPopup(' + s.id + ')">Vol++</span>' :
      vb?.agreesMedian ? '<span class="vb-tag mild sig-tag" title="Both volume measures agree, above median -- tracking only, not yet validated" onclick="event.stopPropagation(); openVolBuildingPopup(' + s.id + ')">Vol+</span>' : '';
    // WIDE tag (2026-08-31, replaces the old per-trade counterfactual note + aggregate
    // research banner per user request). FIXED same day, caught live by user: originally
    // gated on wider_target_mult != null, which only means the mechanism was ARMED at
    // insert time (every trade routed into that branch gets a non-null value regardless of
    // how it resolves) -- NOT that it actually widened. stepWiderTarget() (widerTargetWalker.js)
    // only actually extends the target when the T1 touch arrives within
    // MAX_BARS_TO_T1_FOR_WIDER (4) bars AND the pressure gate confirms; a touch too slow to
    // qualify, or a failed pressure gate, banks a plain PRICE_CLEAN/BANKED_LOW_PRESSURE T1 hit
    // instead, same as if the mechanism never applied. resolution_method is the one field
    // that reflects what actually happened: WIDER_TARGET_HIT/WIDER_STOP_HIT/
    // WIDER_TIME_EXPIRED only get written once stepWiderTarget's `widening` state actually
    // armed and played out.
    //
    // Re-flagged by the user a second time on the same trade (id 109447, 2026-08-31 8:27 AM,
    // bars_to_resolution=9) even after this fix -- traced it against real bars and confirmed
    // NOT a bug: bars_to_resolution is the TOTAL time to final resolution, which includes the
    // extension-riding phase once armed -- it is NOT the bars-to-original-T1-touch figure the
    // 4-bar eligibility check actually uses. This trade's T1 was genuinely reached in 2 bars
    // (well within the window), armed the extension, then rode 7 more bars before the wider
    // target itself printed at bar 9 -- 9 total is exactly what a correctly-engaged extension
    // looks like, not a violation of the 4-bar rule. Tooltip below says this explicitly so a
    // fast-T1/slow-total case doesn't keep reading as a bug.
    const wideTag = /^WIDER_/.test(s.resolution_method || '') ? '<span class="vb-tag wide-tag" title="Wider-target mechanism engaged (1.5x target). Bars-to-resolve includes the extension-riding phase -- the ORIGINAL T1 touch (the actual 4-bar eligibility check) came well before that. SHADOW-tracked, not yet promoted to live.">Tx1.5</span>' : '';
    // Post-entry exit-signal tags (OPEN_DECISION wire_flush_post_entry_exit_signals_globex,
    // 2026-09-02): GLOBEX_FLUSH_* only, read directly off post_entry_exit_signals (already
    // included in /api/setups/today's `s.*`, no separate fetch needed). Tap opens a popup
    // (touchscreen viewers can't hover a title= tooltip) showing this trade's own hypothetical
    // $ plus the mechanism's running cumulative -- NOT a hover tooltip like vbTag/wideTag above.
    // stopPropagation so tapping the tag doesn't also fire the row's own openTradeModal.
    const pes = s.post_entry_exit_signals || {};
    const rsTag = pes.range_slope ? '<span class="vb-tag rangeslope-tag sig-tag" onclick="event.stopPropagation(); openMechanismPopup(' + s.id + ', \'range_slope\')">RS</span>' : '';
    const vrTag = pes.vol_rollover ? '<span class="vb-tag volroll-tag sig-tag" onclick="event.stopPropagation(); openMechanismPopup(' + s.id + ', \'vol_rollover\')">VR</span>' : '';
    // Step-trail shadow tag (Opus Audit #12, 2026-09-04, OPEN_DECISION
    // step_trail_phase2_promotion_pending) -- same tap-not-hover convention as rsTag/vrTag
    // above (touchscreen viewers can't hover a title= tooltip). Only ever present when the
    // real wider-target mechanism armed AND the shadow walk resolved -- see
    // server/routes/acd.js's resolveSetupsByPrice()/completeStepTrailShadows(). Purely
    // observational: this trade's real resolution/stop/actual_pnl are completely unaffected.
    const stTag = s.step_trail_shadow ? '<span class="vb-tag steptrail-tag sig-tag" onclick="event.stopPropagation(); openStepTrailPopup(' + s.id + ')">ST</span>' : '';
    // Pitch and Catch shadow tag (user idea, 2026-09-04, UNVALIDATED -- tracked at explicit
    // user request specifically because it's unproven; see server/services/
    // pitchCatchWalker.js's header for the full negative evidence trail). Shown whenever a
    // confirmed pullback was observed, whether or not it passed the calibrated filter --
    // qualified=false rows still tap-open to show why it was skipped, useful monitoring
    // signal on its own.
    const pcTag = s.pitch_catch_shadow ? '<span class="vb-tag pitchcatch-tag sig-tag" onclick="event.stopPropagation(); openPitchCatchPopup(' + s.id + ')">PC</span>' : '';
    // Direction-loss-alternation gate tag (user idea + user-provided live example, 2026-09-05
    // -- see acd.js's isDirectionLossBlocked() header). Only shown when this trade WOULD have
    // been blocked (the informative case) -- every real trade gets tagged internally, but
    // showing that on every row would just be noise; this is the one worth a human looking at.
    const dgTag = s.direction_gate_shadow?.wouldBeBlocked ? '<span class="vb-tag dirgate-tag sig-tag" onclick="event.stopPropagation(); openDirectionGatePopup(' + s.id + ')">DG</span>' : '';
    // Momentum-against-fade shadow tag (user idea, 2026-09-05 -- see acd.js's
    // getMomentumAgainstFade()/tagMomentumAgainstFadeShadow() header). Only shown when this
    // trade's own reading cleared the calibrated top-quartile "against" cutoff -- the
    // informative case, same convention as dgTag above.
    const mfTag = s.momentum_against_fade_shadow?.against ? '<span class="vb-tag momfade-tag sig-tag" onclick="event.stopPropagation(); openMomentumFadePopup(' + s.id + ')">MF</span>' : '';
    // Breakeven-stop-on-order-flow-rejection shadow tag (2026-09-16) -- only shown on the
    // REWARDED-classified subset (the only class this mechanism ever has a hypothetical
    // response for), same convention as every tag above.
    const bsTag = s.breakeven_stop_shadow?.classification === 'REWARDED' ? '<span class="vb-tag breakevenstop-tag sig-tag" onclick="event.stopPropagation(); openBreakevenStopPopup(' + s.id + ')">BS</span>' : '';
    // Entry-order-flow shadow tag (2026-09-16, entryOrderFlowShadow.js) -- only shown when
    // wouldBeFlagged is true; tag text distinguishes the LONG vs SHORT rule since they're
    // genuinely different conditions (see that file's own header).
    const efTag = s.entry_orderflow_shadow?.wouldBeFlagged
      ? '<span class="vb-tag entryflow-tag sig-tag" onclick="event.stopPropagation(); openEntryFlowPopup(' + s.id + ')">' + (s.entry_orderflow_shadow.rule === 'LONG_REPEAT_ADVERSE_FLOW' ? 'EFL' : 'EFS') + '</span>'
      : '';
    // Late-backfill tag (OPEN_DECISION poller_late_backfill_display_gap_20260914) -- see the
    // CSS comment above. late_backfill_min comes straight from the API (created_at minus
    // fired_at, both naive-timestamp columns diffed in SQL, no JS date-parsing needed here).
    // 5min threshold: normal poll cadence (60s) plus a little slack shouldn't ever trip this
    // for a genuinely real-time fire -- only a real catch-up-after-restart event should.
    const lateMin = s.late_backfill_min || 0;
    const lateTag = lateMin > 5
      ? '<span class="vb-tag late-tag" title="This setup type runs its own background poller. A server restart mid-session can wipe its in-memory tracking, so on the next poll it re-scans and inserts an older signal late -- fired_at is still the real, correct touch time; only the row itself showed up late. Not a live-firing bug, and P&L/timing math for the trade itself is unaffected.">⏱ ' + formatLateDuration(lateMin) + ' late</span>'
      : '';
    // Cluster tag (2026-09-14) -- shown on EVERY member of a multi-row cluster, not just a
    // designated leader (see the CSS comment above for why: picking a leader via
    // is_cluster_primary silently hid a row whenever no member had it set). Tapping opens a
    // popup listing the whole group; it never hides or toggles this row or any other.
    const clusterGroupSize = s.cluster_touch_id ? (clusterGroups.get(s.cluster_touch_id)?.length || 0) : 0;
    const clusterBadge = clusterGroupSize > 1
      ? '<span class="vb-tag cluster-tag sig-tag" title="Fired in the same instant as ' + (clusterGroupSize - 1) + ' other level touch(es) -- each is its own real row for its OWN calibration credit, never a second real trade. Tap to see the whole group." onclick="event.stopPropagation(); openClusterPopup(\'' + s.cluster_touch_id + '\')">🔗 ' + clusterGroupSize + '</span>'
      : '';
    return '<div class="row" onclick="openTradeModal(' + s.id + ')">' +
      '<span class="rdot" style="background:' + dotColor + '"></span>' +
      '<span class="time mono">' + timeLabel + '</span>' +
      '<span class="type">' + (s.setup_type || '').replace(/_/g, ' ') + '</span>' +
      clusterBadge + vbTag + wideTag + rsTag + vrTag + stTag + pcTag + dgTag + mfTag + bsTag + efTag + lateTag +
      '<span class="price mono">' + price + '</span>' +
      '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>';
  };

  // Group rows by cluster_touch_id purely to know each group's size for the tag above and for
  // openClusterPopup() below -- every row still renders flat, in plain chronological order, no
  // grouping/reordering/collapsing of any kind (2026-09-14, replaces the leader/collapsed-
  // sibling design -- see the CSS comment above).
  const clusterGroups = new Map();
  for (const s of displayRows) {
    if (!s.cluster_touch_id) continue;
    if (!clusterGroups.has(s.cluster_touch_id)) clusterGroups.set(s.cluster_touch_id, []);
    clusterGroups.get(s.cluster_touch_id).push(s);
  }

  // timelineRows overridden to whichever set is actually ON SCREEN (so openTradeModal(id) can
  // find a tapped row) -- reassigned here, AFTER the earlier `timelineRows = resolved` above,
  // deliberately: that earlier assignment is what openTradeModal/popups fall back to reading
  // real numbers from when globexWatch is off; this one wins when it's on. Never affects
  // rangeStats/timeline-stats, both already computed from `resolved` before this point.
  timelineRows = displayRows;
  const htmlParts = displayRows.map(rowHtml);
  $('timeline-list').innerHTML = htmlParts.join('');
}

// Cluster group popup (2026-09-14) -- tap target for the 🔗 tag above. Lists every real row
// that shares this cluster_touch_id, each with its own outcome, so a same-instant confluence
// touch reads as a linked group without any row ever being hidden from the main timeline.
function openClusterPopup(clusterTouchId) {
  const members = timelineRows.filter(r => r.cluster_touch_id === clusterTouchId)
    .sort((a, b) => new Date(a.fired_at) - new Date(b.fired_at));
  if (!members.length) return;

  let html = '<div class="m-head"><span class="m-title" style="color:#a5b4fc">Confluence cluster — ' + members.length + ' level(s) touched together</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
  html += '<div class="m-sub">Each row below is its own real SHADOW/ACTIVE row, kept for that level\'s own calibration credit — never a second real trade on the same event.</div>';
  html += mSection('Members');
  for (const m of members) {
    const pnl = m.actual_pnl != null ? Number(m.actual_pnl) : null;
    const outcome = pnl != null ? (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2) : (m.resolution || 'open');
    const color = pnl != null ? (pnl >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--dim)';
    html += mRow((m.setup_type || '').replace(/_/g, ' '), outcome, color);
  }
  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
}

// Session trend history popup (2026-09-15, user request: "give me a history with timestamps
// of what the trend has been and each change for the day I want to compare it to what I see
// on the chart"). Backend replays the SAME classifySessionChar() the live SESSION chip uses,
// bar-by-bar, no lookahead -- this is a genuine historical record of what the chip actually
// showed as the session unfolded, not a guess reconstructed after the fact.
async function openSessionTrendHistoryModal() {
  let html = '<div class="m-head"><span class="m-title" style="color:#a5b4fc">Session trend history — ' + todayET() + '</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
  html += '<div class="m-sub">Loading...</div>';
  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
  try {
    // Check response.ok/body-present BEFORE calling .json() -- a truncated/empty response
    // (e.g. a request landing mid-server-restart) throws "Unexpected end of JSON input" from
    // .json() itself, which is a confusing raw error to show; this gives a real, retriable
    // message instead. Found live 2026-09-15 (user report) -- most likely cause was several
    // dev-server restarts happening in quick succession while this feature was being built.
    const resp = await fetch('/api/morning-brief/session-trend-history/' + todayET());
    if (!resp.ok) throw new Error('Server returned ' + resp.status + ' — try again in a moment.');
    const text = await resp.text();
    if (!text) throw new Error('Empty response — the server may have just restarted. Try again.');
    const data = JSON.parse(text);
    if (data.noData || !data.history?.length) {
      html = '<div class="m-head"><span class="m-title" style="color:#a5b4fc">Session trend history — ' + todayET() + '</span>' +
        '<button class="m-close" onclick="closeTradeModal()">×</button></div>' +
        '<div class="m-sub">Not enough bars yet today to compute a history.</div>';
      $('modal').innerHTML = html;
      return;
    }
    html = '<div class="m-head"><span class="m-title" style="color:#a5b4fc">Session trend history — ' + todayET() + '</span>' +
      '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
    html += '<div class="m-sub">Each row is the exact minute the SESSION chip would have changed to a new value — compare timestamps directly against the chart.</div>';
    html += mSection('Changes (' + data.history.length + ')');
    // Newest first, matching the Session Timeline card's own convention.
    for (const h of [...data.history].reverse()) {
      const cc = h.sessionChar === 'EXTREME_CHOP' ? 'var(--red)' : h.sessionChar === 'CHOP' ? 'var(--amber)' : h.sessionChar.includes('TREND') ? 'var(--green)' : 'var(--dim)';
      html += mRow(h.time + '  @ ' + Math.round(h.price), h.sessionChar.replace(/_/g, ' ') + '  (rots=' + h.rots + ')', cc);
    }
    $('modal').innerHTML = html;
  } catch (e) {
    html = '<div class="m-head"><span class="m-title" style="color:#a5b4fc">Session trend history</span>' +
      '<button class="m-close" onclick="closeTradeModal()">×</button></div>' +
      '<div class="m-sub" style="color:var(--red)">Failed to load: ' + e.message + '</div>';
    $('modal').innerHTML = html;
  }
}

// ---- Trade detail modal ----
function mRow(k, v, color) {
  if (v == null || v === '') return '';
  return '<div class="m-row"><span class="m-k">' + k + '</span><span class="m-v mono" style="color:' + (color || 'var(--text)') + '">' + v + '</span></div>';
}
function mSection(label) { return '<div class="m-section">' + label + '</div>'; }

// RTH-adjacent check (2026-09-16, DeepSeek code review fix) -- matches acd.js's own
// RTH_SESSION_FIRED_AT_SQL boundary (9:30am-6pm ET, [570,1080) minutes) exactly, NOT the
// narrower `is_rth` generated column (9:30am-4pm, [570,960)) this file used before. The two
// disagreeing meant a real 4-6pm dead-zone fire could get flagged/counted as "RTH" by
// entryOrderFlowShadow.js/loss-prevention-summary while being excluded here as "Globex" --
// widened to the same boundary everywhere so a fire's session classification never depends on
// which part of the page you're looking at. Parses fired_at_str ('YYYY-MM-DD HH:MM:SS', always
// naive ET per this codebase's own convention) directly via string slicing -- no Date parsing,
// so no ambient-timezone risk.
function isRthAdjacent(s) {
  if (!s.fired_at_str) return false;
  const hh = +s.fired_at_str.slice(11, 13), mm = +s.fired_at_str.slice(14, 16);
  const mod = hh * 60 + mm;
  return mod >= 570 && mod < 1080;
}

// $ delta shown DIRECTLY on each row's tag (2026-09-16 user request: "I only want to see the
// tags listed and pnl items... inside the card" -- not hidden behind a tap-to-open popup).
// Same two mechanism-shape definitions as shadowTagRows()/loss-prevention-summary
// (server/routes/setups.js) -- gate-type net = -actual_pnl (hypothetical is "no trade taken"),
// alt-exit net = hypothetical_pnl - actual_pnl. Returns '' (no suffix) when pnl/hyp aren't known
// yet, never a misleading $0.
function gateDeltaText(pnl, flagged) {
  if (!flagged || pnl == null) return '';
  const net = -pnl;
  return ' ' + (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toFixed(0);
}
function altDeltaText(pnl, hyp) {
  if (hyp == null || pnl == null) return '';
  const net = Number(hyp) - pnl;
  return ' ' + (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toFixed(0);
}

// Every observation-only shadow tag this codebase tracks, rendered directly on the trade card
// (2026-09-16 user request: "add all the tags that might apply to a trade, to the trade card
// itself as well as the pnl save attributed to it... there are a few things we're tracking and
// i need to keep an eye on all of them"). Two mechanism shapes, matching loss-prevention-
// summary's own convention exactly (server/routes/setups.js) so the per-trade $ shown here is
// never a different definition than the aggregate rollup:
//   - Gate-type (DirGate/MomFade/EntryFlow-L/EntryFlow-S): hypothetical if honored is "no trade
//     taken" -- net = -actual_pnl (saves the loss if actual_pnl was negative, forfeits the win
//     if it was positive).
//   - Alt-exit-type (StepTrail/PitchCatch/RangeSlope/VolRoll/BreakevenStop): each already
//     carries its own hypothetical_pnl for a DIFFERENT exit -- net = hypothetical_pnl - actual_pnl.
// `s.actual_pnl` must be a real, resolved number for any $ delta to mean anything -- an
// unresolved/still-open row shows the flag with no dollar figure rather than a misleading $0.
// Naive-string minute diff (2026-09-16, user request: "I want to see the timing but also the
// pnl impact when they fire" -- a behavior-monitoring view, not a market-microstructure one:
// DirGate/MomFade/EntryFlow are all computed at the SAME instant, right after the real INSERT
// (their own checkedAt fields differ only by however long each sequential DB call took --
// milliseconds, always in the same DirGate->MomFade->EntryFlow code order -- so showing that
// as "which one caught it first" would be meaningless, always the same answer regardless of
// the market). Those 3 are simply "at entry." StepTrail/BreakevenStop DO carry a real
// `armed_at` (when that mechanism's OWN trigger condition first became true, genuinely later
// in the trade's life) and RangeSlope/VolRoll carry their own `fired_at` the same way -- these
// ARE meaningfully different points in time per trade, shown as minutes-after-entry. Both
// s.fired_at_str and every mechanism's own armed_at/fired_at are the same naive 'YYYY-MM-DD
// HH:MM:SS' ET wall-clock shape, so diffing them as same-epoch instants gives the correct real
// elapsed minutes with no Date-parsing/ambient-timezone risk (this codebase's own naive-vs-
// naive-arithmetic-is-safe convention -- only a naive-vs-genuinely-UTC comparison needs care).
function naiveToMs(str) {
  if (!str) return null;
  const [d, t] = str.split(' ');
  const [y, mo, da] = (d || '').split('-').map(Number);
  const [h, mi, se] = (t || '00:00:00').split(':').map(Number);
  if (!y || !mo || !da) return null;
  return Date.UTC(y, mo - 1, da, h || 0, mi || 0, se || 0);
}
function minutesAfterEntry(s, naiveStr) {
  const a = naiveToMs(s.fired_at_str), b = naiveToMs(naiveStr);
  if (a == null || b == null) return null;
  return Math.round((b - a) / 60000);
}
function fmtMinutesAfter(mins) {
  if (mins == null) return null;
  if (mins <= 0) return 'at entry';
  if (mins < 60) return mins + 'min after entry';
  return (mins / 60).toFixed(1) + 'hr after entry';
}
function shadowTagRows(s) {
  const pnl = s.actual_pnl != null ? parseFloat(s.actual_pnl) : null;
  function gateRow(label, flagged, extra) {
    // Only the flagged case is shown -- same "showing every row would just be noise" convention
    // as the row-level tags (dgTag/mfTag/efTag above only render when true). Fixed 2026-09-16
    // after the user pointed out a "not flagged" row is exactly that noise.
    if (!flagged) return '';
    // All 3 gate-type mechanisms evaluate the exact same "as of entry" moment (see header) --
    // "at entry" is the honest answer, not a fabricated fine-grained order.
    const timing = 'at entry';
    if (pnl == null) return mRow(label, timing + ' · flagged' + (extra ? ' (' + extra + ')' : ''), 'var(--amber)');
    const net = -pnl;
    return mRow(label, timing + ' · ' + (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toFixed(2) + (extra ? ' (' + extra + ')' : ''), net >= 0 ? 'var(--green)' : 'var(--red)');
  }
  function altExitRow(label, hyp, naiveTimingStr) {
    if (hyp == null || pnl == null) return '';
    const net = Number(hyp) - pnl;
    const timing = fmtMinutesAfter(minutesAfterEntry(s, naiveTimingStr));
    const timingPart = timing ? timing + ' · ' : ''; // omit rather than fabricate when no real timestamp exists (e.g. PitchCatch never recorded one)
    return mRow(label, timingPart + (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toFixed(2) + ' vs. actual', net >= 0 ? 'var(--green)' : 'var(--red)');
  }
  let out = '';
  if (s.direction_gate_shadow) out += gateRow('DirGate', s.direction_gate_shadow.wouldBeBlocked, s.direction_gate_shadow.direction);
  if (s.momentum_against_fade_shadow) out += gateRow('MomFade', s.momentum_against_fade_shadow.against);
  if (s.entry_orderflow_shadow) {
    const r = s.entry_orderflow_shadow;
    out += gateRow(r.rule === 'LONG_REPEAT_ADVERSE_FLOW' ? 'EntryFlow-L' : 'EntryFlow-S', r.wouldBeFlagged);
  }
  if (s.step_trail_shadow) out += altExitRow('StepTrail', s.step_trail_shadow.hypothetical_pnl, s.step_trail_shadow.armed_at);
  if (s.pitch_catch_shadow && s.pitch_catch_shadow.qualified === true) out += altExitRow('PitchCatch', s.pitch_catch_shadow.hypothetical_pnl, null);
  if (s.post_entry_exit_signals?.range_slope) out += altExitRow('RangeSlope', s.post_entry_exit_signals.range_slope.hypothetical_pnl, s.post_entry_exit_signals.range_slope.fired_at);
  if (s.post_entry_exit_signals?.vol_rollover) out += altExitRow('VolRoll', s.post_entry_exit_signals.vol_rollover.hypothetical_pnl, s.post_entry_exit_signals.vol_rollover.fired_at);
  if (s.breakeven_stop_shadow && s.breakeven_stop_shadow.classification === 'REWARDED') out += altExitRow('BreakevenStop', s.breakeven_stop_shadow.hypothetical_pnl, s.breakeven_stop_shadow.armed_at);
  return out;
}

function openTradeModal(id) {
  const s = timelineRows.find(r => r.id === id);
  if (!s) return;
  const isWin = isWinRow(s);
  const isLoss = isLossRow(s);
  const color = isWin ? 'var(--green)' : isLoss ? 'var(--red)' : 'var(--dim)';
  const pnl = s.actual_pnl != null ? parseFloat(s.actual_pnl) : null;

  let html = '<div class="m-head"><span class="m-title" style="color:' + color + '">' + (s.setup_type || '').replace(/_/g, ' ') + '</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
  html += '<div class="m-sub">' + (isRthAdjacent(s) ? 'RTH' : 'Overnight/Globex') + ' · ' + (s.origin_status || 'UNKNOWN') + ' · id ' + s.id + '</div>';

  html += mSection('Outcome');
  html += mRow('Resolution', s.resolution, color);
  html += mRow('Method', s.resolution_method);
  html += mRow('P&L (net)', pnl != null ? (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2) : null, pnl != null ? (pnl >= 0 ? 'var(--green)' : 'var(--red)') : null);
  // Claimed vs. possible (2026-08-09, user request): pnl is net of the $2 round-trip
  // commission (server/routes/acd.js's live resolution constants) -- back out the points
  // actually captured (signedPts = (pnl + COMMISSION) / PNL_PER_POINT, valid for both a win
  // and a loss since commission is always subtracted regardless of direction) and compare
  // against mfe_points, the best favorable excursion that was actually available during the
  // trade's life. Only shown when both are known -- MAE/MFE aren't captured on every
  // resolution path (e.g. some pre-2026-07 rows, or a resolution with no price data at all).
  // FIXED 2026-08-13: was `(pnl + 1) / 2`, stale from before the 2026-08-11 commission
  // correction -- see COMMISSION_PER_TRADE's own comment above for the full incident.
  if (pnl != null && s.mfe_points != null && Number(s.mfe_points) > 0) {
    const capturedPts = (pnl + COMMISSION_PER_TRADE) / 2; // MNQ: $2/pt round-trip commission
    const pct = Math.max(0, Math.min(999, (capturedPts / Number(s.mfe_points)) * 100));
    html += mRow('Captured vs. available', capturedPts.toFixed(1) + 'pt of ' + Number(s.mfe_points).toFixed(1) + 'pt MFE (' + pct.toFixed(0) + '%)',
      pct >= 70 ? 'var(--green)' : pct >= 35 ? 'var(--amber)' : 'var(--red)');
  }
  html += mRow('Bars to resolve', s.bars_to_resolution);

  html += mSection('Levels');
  html += mRow('Entry', s.entry_zone_low != null ? Number(s.entry_zone_low).toFixed(2) : null);
  html += mRow('Stop', s.stop_level != null ? Number(s.stop_level).toFixed(2) : null, 'var(--red)');
  html += mRow('T1', s.t1_level != null ? Number(s.t1_level).toFixed(2) : null, 'var(--green)');
  html += mRow('MAE', s.mae_points != null ? Number(s.mae_points).toFixed(1) + 'pt' : null);
  html += mRow('MFE', s.mfe_points != null ? Number(s.mfe_points).toFixed(1) + 'pt' : null);

  html += mSection('Timing');
  html += mRow('Fired', s.fired_at_str);
  html += mRow('Resolved', s.resolved_at ? String(s.resolved_at).replace('T', ' ').slice(0, 19) : null);

  const hasSignals = s.bar6_checkpoint || s.bar6_exit_recommended || s.delta_confirmation_state || s.touch_quality || (s.confluence_levels_at_detection && s.confluence_levels_at_detection.length);
  if (hasSignals) {
    html += mSection('Signals at the time');
    if (s.bar6_exit_recommended) html += mRow('Bar-6', '🚨 EXIT NOW', 'var(--amber)');
    else if (s.bar6_checkpoint) html += mRow('Bar-6', s.bar6_checkpoint, s.bar6_checkpoint === 'RECOVERING' ? 'var(--green)' : 'var(--red)');
    if (s.delta_confirmation_state) html += mRow('Delta', s.delta_confirmation_state);
    if (s.touch_quality) html += mRow('Touch quality', s.touch_quality);
    if (s.confluence_levels_at_detection && s.confluence_levels_at_detection.length) html += mRow('Confluence', s.confluence_levels_at_detection.join(', '));
  }

  // Every observation-only shadow tag this trade might carry, with the $ save/cost attributed
  // to it (2026-09-16 user request) -- same tap-target tags as the row itself, spelled out with
  // dollar figures here since the row can only show a short badge.
  const tagRows = shadowTagRows(s);
  if (tagRows) {
    html += mSection('Tracked mechanisms (observation-only)');
    html += tagRows;
  }

  if (s.historical_win_rate != null) {
    html += mSection('Calibrated at detection');
    html += mRow('Historical WR', (Number(s.historical_win_rate) * 100).toFixed(0) + '%');
    html += mRow('Sample size', s.historical_sessions);
  }

  // Cluster dedup tags (2026-07-29): when several level names sit in the same price zone,
  // only one fires as the real trade -- the others still resolve for their own calibration
  // credit but get attributed here instead of counting as separate live P&L. Shown as chips
  // so it's visually distinct from the "Confluence" context row above (that's about nearby
  // levels at detection; this is specifically about other setups deduped INTO this trade).
  if (s.cluster_attributed_setups && s.cluster_attributed_setups.length) {
    html += mSection('Also represents (deduped, same zone)');
    html += '<div style="display:flex;flex-wrap:wrap;gap:5px;">' +
      s.cluster_attributed_setups.map(t => '<span style="font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(165,180,252,0.12);border:1px solid rgba(165,180,252,0.35);color:#a5b4fc;">' + t.replace(/_/g, ' ') + '</span>').join('') +
      '</div>';
  }

  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
}

  const s = timelineRows.find(r => r.id === id);
  const vb = s?.vol_building_signal;
  if (!s || !vb) return;

  const real = s.actual_pnl != null ? Number(s.actual_pnl) : null;
  const strength = vb.agreesP60 ? 'Strong (Vol++)' : vb.agreesMedian ? 'Building (Vol+)' : 'Neither';
  let html = '<div class="m-head"><span class="m-title" style="color:#93c5fd">Volume Building — ' + strength + '</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
  html += '<div class="m-sub">' + (s.setup_type || '').replace(/_/g, ' ') + ' · id ' + s.id + ' · TRACKING ONLY, not yet validated as a fade filter — this trade fired at full size regardless</div>';

  html += mSection('This trade');
  html += mRow('What actually happened', real != null ? (real >= 0 ? '+' : '') + '$' + real.toFixed(2) : null,
    real != null ? (real >= 0 ? 'var(--green)' : 'var(--red)') : null);
  html += mRow('Composite strength (at touch)', vb.compositeStrength != null ? Number(vb.compositeStrength).toFixed(2) : null);
  html += mRow('Prior-average composite strength', vb.compositeStrengthPriorAvg != null ? Number(vb.compositeStrengthPriorAvg).toFixed(2) : null);
  html += mRow('Time-of-day volZ (agrees median / p60)', (vb.agreesMedian ? 'yes' : 'no') + ' / ' + (vb.agreesP60 ? 'yes' : 'no'));
  html += mRow('Day-relative volZ', vb.avgDayVolZ != null ? Number(vb.avgDayVolZ).toFixed(2) : null);

  html += mSection('Why no running total is shown here');
  html += '<div class="m-row"><span class="m-k" style="color:var(--dim)">This signal predicts a BIGGER swing coming, in either direction — not that the fade itself does better or worse. A blanket EV split against the fade roster was tested and found opposite-signed by setup family, so no single aggregate number would be honest here (see docs/VOLUME_BUILDING_EXPANSION_SIGNAL_SPEC.md).</span></div>';

  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
}

function to12Hour(hhmm) {
  if (!hhmm) return '';
  let [h, m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

// Used by the late-backfill tag (OPEN_DECISION poller_late_backfill_display_gap_20260914).
// min is already a plain integer from the API (SQL-computed, no date parsing here).
function formatLateDuration(min) {
  if (min < 60) return min + 'm';
  const hrs = min / 60;
  return (hrs >= 10 ? Math.round(hrs) : hrs.toFixed(1)) + 'h';
}

// ---- Aggregation by setup type (shared by today + week) ----
function aggregateBySetup(rows) {
  const map = new Map();
  for (const s of rows) {
    const key = s.setup_type || 'UNKNOWN';
    if (!map.has(key)) map.set(key, { type: key, n: 0, wins: 0, losses: 0, pnl: 0 });
    const g = map.get(key);
    g.n++;
    if (isWinRow(s)) g.wins++;
    else if (isLossRow(s)) g.losses++;
    if (s.actual_pnl != null) g.pnl += parseFloat(s.actual_pnl);
  }
  return [...map.values()].sort((a, b) => b.pnl - a.pnl);
}

function renderAggTable(containerId, rows) {
  const groups = aggregateBySetup(rows);
  if (!groups.length) { $(containerId).innerHTML = '<div class="loading">Nothing fired yet</div>'; return; }

  let totalN = 0, totalWins = 0, totalLosses = 0, totalPnl = 0;
  let body = groups.map(g => {
    totalN += g.n; totalWins += g.wins; totalLosses += g.losses; totalPnl += g.pnl;
    const decided = g.wins + g.losses;
    const wr = decided > 0 ? (g.wins / decided * 100).toFixed(0) + '%' : '—';
    const pnlColor = g.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    return '<tr>' +
      '<td><span class="setup-name" title="' + g.type + '">' + g.type.replace(/_/g, ' ') + '</span></td>' +
      '<td class="num mono">' + g.n + '</td>' +
      '<td class="num mono">' + wr + '</td>' +
      '<td class="num mono" style="color:' + pnlColor + '">' + (g.pnl >= 0 ? '+' : '') + '$' + g.pnl.toFixed(0) + '</td>' +
      '</tr>';
  }).join('');

  const decidedTotal = totalWins + totalLosses;
  const wrTotal = decidedTotal > 0 ? (totalWins / decidedTotal * 100).toFixed(0) + '%' : '—';
  const totalColor = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  body += '<tr class="total"><td>Total (' + groups.length + ' types)</td>' +
    '<td class="num mono">' + totalN + '</td>' +
    '<td class="num mono">' + wrTotal + '</td>' +
    '<td class="num mono" style="color:' + totalColor + '">' + (totalPnl >= 0 ? '+' : '') + '$' + totalPnl.toFixed(0) + '</td></tr>';

  $(containerId).innerHTML = '<table class="agg"><thead><tr><th>Setup</th><th class="num">N</th><th class="num">WR</th><th class="num">P&L</th></tr></thead><tbody>' + body + '</tbody></table>';
}

// ---- Equity curve (canvas, no library) — with $ Y-axis and date/time X-axis ----
function fmtAxisMoney(v) {
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  return sign + '$' + (abs >= 1000 ? (abs / 1000).toFixed(1) + 'k' : abs.toFixed(0));
}
function fmtAxisTime(firedAtStr, useTime) {
  if (!firedAtStr) return '';
  const datePart = firedAtStr.slice(0, 10);
  const timePart = firedAtStr.slice(11, 16);
  if (useTime) return to12Hour(timePart);
  const [, mo, d] = datePart.split('-');
  return mo + '/' + d;
}

// Net P&L, gross P&L, commission, and max intraday drawdown -- 2026-08-09, user request
// ("show the max drawdown... to gauge how it perform on a prop account. Need to try and
// prevent hitting DLLs" + "show the pnl, the commission spent... and the pnl net"). Max
// drawdown is peak-to-trough on the CHRONOLOGICAL cumulative P&L curve (running peak minus
// current running total, maximized over the sequence) -- the standard prop-account DLL-risk
// framing, not just "worst single loss." Reuses the exact same `decided` population (any row
// with a real, settled actual_pnl) and chronological sort as renderEquityCurve() so the two
// stay self-consistent -- computing this from a differently-filtered/ordered set would
// silently disagree with what the chart shows (this exact drift, both from the narrower
// TARGET_HIT/STOP_HIT/TIME_EXPIRED/SESSION_CLOSED filter, is what got fixed 2026-08-13).
// Any row with a real, settled actual_pnl counts as "decided" -- matches Session Timeline's
// definition exactly (renderTimeline() above), not just 4 hardcoded resolution types. Was
// previously narrower (TARGET_HIT/STOP_HIT/TIME_EXPIRED/SESSION_CLOSED only), silently
// excluding INVALIDATED rows that carry a real mark-to-market actual_pnl (per the
// resolveSetupsByPrice() fix documented in CLAUDE.md).
//
// Extracted (2026-09-08) out of computeRangeStats() into its own function -- renderEquityCurve()
// below used to independently re-implement this exact same filter+sort inline, with its own
// comment acknowledging "must stay in sync or the chart and the stats line above it would
// silently disagree." That's exactly the duplication risk this codebase's own "share modules
// instead of reimplementing" convention exists to prevent, and it nearly bit here: fixing the
// cluster-dedup bug below in only one of the two copies would have left the equity curve
// showing a different (still-inflated) number than the stats line sitting right above it.
//
// FIXED same day (user caught live: Net P&L swung from a real -$54.50 to a displayed +$737.90
// on the same day, purely from this gap): a confluence touch writes ONE real decision
// (is_cluster_primary=true) plus is_cluster_primary=false sibling rows for every other level
// that touched the same instant -- each sibling gets its own real, resolvable P&L for ITS OWN
// setup-type calibration credit, but it is NOT a second independent trade. Summing every row
// without this filter counts the same real market event once per cluster member, exactly the
// overcounting CLAUDE.md's is_cluster_primary hard rule warns about for any aggregation.
function getDecidedRows(rows) {
  return rows
    .filter(s => s.actual_pnl != null && s.is_cluster_primary !== false)
    .sort((a, b) => (a.fired_at_str || '').localeCompare(b.fired_at_str || ''));
}

function computeRangeStats(rows) {
  const decided = getDecidedRows(rows);

  let running = 0, peak = 0, maxDD = 0;
  let wins = 0, losses = 0;
  for (const s of decided) {
    running += parseFloat(s.actual_pnl);
    if (isWinRow(s)) wins++; else if (isLossRow(s)) losses++;
    if (running > peak) peak = running;
    const dd = peak - running;
    if (dd > maxDD) maxDD = dd;
  }
  const netPnl = running;
  const commission = decided.length * COMMISSION_PER_TRADE;
  const grossPnl = netPnl + commission;
  return { n: decided.length, wins, losses, netPnl, grossPnl, commission, maxDD };
}

function renderRangeStats(containerId, rows) {
  const s = computeRangeStats(rows);
  if (s.n === 0) { $(containerId).innerHTML = ''; return; }
  const clr = (v) => v >= 0 ? 'var(--green)' : 'var(--red)';
  $(containerId).innerHTML =
    '<span>Net <b class="mono" style="color:' + clr(s.netPnl) + '">' + (s.netPnl >= 0 ? '+' : '') + '$' + s.netPnl.toFixed(0) + '</b></span>' +
    '<span title="Before commission">Gross <b class="mono" style="color:var(--muted)">' + (s.grossPnl >= 0 ? '+' : '') + '$' + s.grossPnl.toFixed(0) + '</b></span>' +
    '<span title="$' + COMMISSION_PER_TRADE + '/round-trip x ' + s.n + '">Comm <b class="mono" style="color:var(--dim)">-$' + s.commission.toFixed(0) + '</b></span>' +
    '<span title="Peak-to-trough on the cumulative P&L curve -- the DLL-risk figure">Max DD <b class="mono" style="color:' + (s.maxDD > 0 ? 'var(--amber)' : 'var(--dim)') + '">-$' + s.maxDD.toFixed(0) + '</b></span>';
}

function renderEquityCurve(canvasId, rows, range) {
  const canvas = $(canvasId);
  // Shared with computeRangeStats() via getDecidedRows() (2026-09-08 -- previously a separate
  // inline copy that could silently drift, see that function's header for the incident).
  const decided = getDecidedRows(rows);

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (decided.length < 2) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Not enough resolved trades yet', w / 2, h / 2);
    return;
  }

  let running = 0;
  const points = [0]; // cumulative pnl values
  const times = [decided[0].fired_at_str]; // matching timestamp per point (point 0 borrows the first trade's time)
  for (const s of decided) { running += parseFloat(s.actual_pnl); points.push(running); times.push(s.fired_at_str); }

  const min = Math.min(0, ...points), max = Math.max(0, ...points);
  const valRange = (max - min) || 1;
  const padL = 52, padR = 8, padT = 10, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xAt = (i) => padL + (i / (points.length - 1)) * plotW;
  const yAt = (v) => padT + plotH - ((v - min) / valRange) * plotH;

  // Y-axis gridlines + $ labels (min, 0 if in range, max — 3-4 ticks)
  const yTicks = [...new Set([min, 0, max].filter(v => v >= min && v <= max))].sort((a, b) => a - b);
  ctx.font = '10px monospace'; ctx.textAlign = 'right';
  for (const t of yTicks) {
    const y = yAt(t);
    ctx.strokeStyle = t === 0 ? 'rgba(148,163,184,0.3)' : 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.75)';
    ctx.fillText(fmtAxisMoney(t), padL - 6, y + 3);
  }

  // X-axis date/time labels — today shows times, everything else shows dates
  const useTime = range === 'today';
  const xTickCount = Math.min(5, points.length);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(148,163,184,0.75)';
  for (let k = 0; k < xTickCount; k++) {
    const idx = xTickCount === 1 ? 0 : Math.round((k / (xTickCount - 1)) * (points.length - 1));
    const x = xAt(idx);
    ctx.fillText(fmtAxisTime(times[idx], useTime), Math.min(Math.max(x, padL + 20), w - padR - 20), h - 4);
  }

  const finalPnl = points[points.length - 1];
  const lineColor = finalPnl >= 0 ? '#4ade80' : '#f87171';
  const fillColor = finalPnl >= 0 ? 'rgba(74,222,128,0.12)' : 'rgba(248,113,113,0.12)';

  ctx.beginPath();
  points.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.lineTo(xAt(points.length - 1), yAt(0)); ctx.lineTo(xAt(0), yAt(0)); ctx.closePath();
  ctx.fillStyle = fillColor; ctx.fill();

  ctx.beginPath();
  points.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = lineColor; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
  ctx.fillText((finalPnl >= 0 ? '+' : '') + '$' + finalPnl.toFixed(0), w - padR - 2, padT + 12);
}

// ---- Performance: filterable range (today/week/month/year/all), one chart switched by
// a Live/All toggle. "Live" = origin_status='ACTIVE' only (real alerts, matches Session
// Timeline's own default). "All" = every row for the period regardless of origin_status,
// i.e. live + SHADOW (background-tracked, never alerted) + BACKFILL/UNKNOWN (synthetic).
// Both populations are fetched in parallel on every range change and cached client-side,
// so toggling Live/All is an instant re-render with no extra fetch. CHANGED 2026-08-13
// twice in the same day: first from a single curve behind a checkbox toggle to two
// always-visible stacked curves (misread "show me live and all individually" as "show both
// at once"), then reverted to this toggle per direct correction: "I want the equity chart
// with live to show when i toggle live and i want the equity chart for all when i toggle
// all" -- i.e. switch which one is shown, don't show both.
let currentRange = 'today';
let performanceFilter = localStorage.getItem('performanceFilter') || 'live'; // 'live' | 'all'
let currentRangeRowsLive = [];
let currentRangeRowsAll = [];
let currentLiveData = null, currentAllData = null;
// Guards against out-of-order responses: 'all'/'year' can scan 10,000+ rows and take far
// longer than 'today'/'week', so a slow request kicked off by an earlier tab click can
// resolve AFTER a faster request from a later click and silently overwrite the display --
// the range buttons would show the newly-clicked tab as active while the numbers/curve
// underneath are actually from the stale click. Found 2026-08-13 from a direct user report
// ("week/year/all showing data from 'all tab'"). Each call captures its own request id;
// a response is only rendered if no newer loadRange() call has started since.
let rangeRequestSeq = 0;

function subcountLabel(data) {
  const liveN = data.liveCount || 0, shadowN = data.shadowCount || 0, backfillN = data.backfillCount || 0;
  const parts = [];
  if (shadowN > 0) parts.push(shadowN.toLocaleString() + ' background');
  if (backfillN > 0) parts.push(backfillN.toLocaleString() + ' backfill/unknown');
  return { liveN, shadowN, backfillN, parts };
}

function renderPerfToggle() {
  $('perf-toggle').innerHTML = [['live', 'Live'], ['all', 'All']].map(([val, label]) =>
    '<button data-pf="' + val + '" class="' + (performanceFilter === val ? 'active' : '') + '">' + label + '</button>'
  ).join('');
  $('perf-toggle').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setPerformanceFilter(b.dataset.pf)));
}

function setPerformanceFilter(f) {
  performanceFilter = f;
  localStorage.setItem('performanceFilter', f);
  renderPerformance();
}

// Re-renders from already-fetched cached data -- no network call, so the Live/All toggle
// switches instantly.
function renderPerformance() {
  renderPerfToggle();
  const rows = performanceFilter === 'live' ? currentRangeRowsLive : currentRangeRowsAll;
  const data = performanceFilter === 'live' ? currentLiveData : currentAllData;
  if (!data) return; // nothing fetched yet

  if (performanceFilter === 'live') {
    const info = subcountLabel(data);
    $('perf-subcount').textContent = '(' + info.liveN.toLocaleString() + ' real trade' + (info.liveN === 1 ? '' : 's') + ')';
  } else {
    const info = subcountLabel(data);
    const total = info.liveN + info.shadowN + info.backfillN;
    $('perf-subcount').textContent = info.parts.length
      ? '(' + total.toLocaleString() + ' total — ' + info.liveN.toLocaleString() + ' live + ' + info.parts.join(' + ') + ')'
      : '(' + total.toLocaleString() + ' total, all live)';
  }

  renderRangeStats('range-stats', rows);
  renderAggTable('range-agg', rows);
  renderEquityCurve('range-equity', rows, currentRange);
}

async function loadRange(range) {
  currentRange = range;
  const myRequestId = ++rangeRequestSeq;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  try {
    const [liveData, allData] = await Promise.all([
      fetch('/api/setups/range-summary?range=' + range + '&origin=live').then(r => r.json()),
      fetch('/api/setups/range-summary?range=' + range + '&origin=all').then(r => r.json()),
    ]);
    if (myRequestId !== rangeRequestSeq) return; // a newer tab click/poll superseded this response -- discard

    currentRangeRowsLive = Array.isArray(liveData?.setups) ? liveData.setups : [];
    currentRangeRowsAll = Array.isArray(allData?.setups) ? allData.setups : [];
    currentLiveData = liveData;
    currentAllData = allData;
    $('range-label').textContent = liveData.rangeLabel || allData.rangeLabel || '';

    renderPerformance();
  } catch (e) { /* keep last good render */ }
}

document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => loadRange(btn.dataset.range));
});

// ---- Hamburger nav ----
function toggleNavMenu() { $('nav-menu').classList.toggle('open'); }
function jumpTo(id) {
  $('nav-menu').classList.remove('open');
  if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = $(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.addEventListener('click', (e) => {
  if (!$('nav-menu').contains(e.target) && !$('hamburger-btn').contains(e.target)) {
    $('nav-menu').classList.remove('open');
  }
});

// Delegated click handler for the timeline toggles (Live/All, Vol Building). Both toggles'
// buttons are recreated by innerHTML on every loadTimeline() poll (20s) -- a listener bound
// directly to a button node is lost if that node gets replaced mid-tap, which reads to a user
// as "I see it but can't click on it" (found live 2026-08-28). Binding to `document` once and
// matching via closest() means the handler survives every re-render, since it's never attached
// to the buttons themselves.
document.addEventListener('click', (e) => {
  const tfBtn = e.target.closest('[data-tf]');
  if (tfBtn) { setTimelineFilter(tfBtn.dataset.tf); return; }
  const tagBtn = e.target.closest('[data-tag]');
  if (tagBtn) { setTagFilter(tagBtn.dataset.tag); return; }
  const gwBtn = e.target.closest('[data-gw]');
  if (gwBtn) { setGlobexWatch(gwBtn.dataset.gw === 'on'); return; }
});

// ---- Boot ----
loadPulse();
loadTimeline();
loadRange('today');
loadFlushExitSignalsSummary(); // slow-changing (weekly cron writes it) -- fetch once, no poll
loadStepTrailShadowSummary(); // slow-changing (weekly cron writes the frac calib) -- fetch once, no poll
loadPitchCatchShadowSummary(); // slow-changing (weekly cron writes the filter calib) -- fetch once, no poll
loadDirectionGateSummary(); // slow-changing (this is a live query over real trades, not a calib row) -- fetch once, no poll
loadMomentumFadeShadowSummary(); // slow-changing (live query over real trades) -- fetch once, no poll
loadBreakevenStopShadowSummary(); // slow-changing (live query over real trades) -- fetch once, no poll
loadEntryFlowShadowSummary(); // slow-changing (live query over real trades) -- fetch once, no poll
loadVolRegime(); // slow-changing (nightly cron writes it) -- poll every 5min below, not every 15s like the live pulse
loadMlSilo(); // slow-changing (verdicts backfilled daily, model retrained manually) -- poll every 5min below
loadPulseReading(); // live, but bar-level (5-min) not tick-level -- 60s poll is plenty, no need for loadPulse's 15s cadence
loadTagRanking(); // top-5-by-$-impact filter row -- ranked off today's own data, 60s poll below keeps it current
setInterval(loadPulse, 15000);
setInterval(loadTimeline, 20000);
setInterval(() => loadRange(currentRange), 60000);
setInterval(loadVolRegime, 300000);
setInterval(loadMlSilo, 300000);
setInterval(loadPulseReading, 60000);
setInterval(loadTagRanking, 60000);

// Mobile browsers throttle or fully suspend setInterval timers on a backgrounded tab (screen
// lock, app switch) -- this page is checked mostly on a phone via the Cloudflare tunnel, so
// that's the common case, not an edge case. Without this, a poll that should've landed 15-20s
// ago silently doesn't, and the page shows stale data until the user manually reloads (found
// 2026-09-17: a real SHADOW fire wasn't visible until a hard refresh). Force an immediate
// refresh of every poll on regaining visibility, not just waiting for the next interval tick.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  loadPulse();
  loadTimeline();
  loadRange(currentRange);
  loadVolRegime();
  loadMlSilo();
  loadPulseReading();
  loadTagRanking();
});

window.addEventListener('resize', () => {
  const rows = performanceFilter === 'live' ? currentRangeRowsLive : currentRangeRowsAll;
  renderEquityCurve('range-equity', rows, currentRange);
});
</script>
