<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick Check</title>
<style>
  :root {
    --green: #22c55e; --green-soft: #4ade80;
    --red: #ef4444; --red-soft: #f87171;
    --amber: #f59e0b; --amber-soft: #fbbf24;
    --muted: #94a3b8; --dim: #64748b;
    --text: #e2e8f0;
    --bg: #0b1120; --card: rgba(15,23,42,0.7);
    --border: rgba(51,65,85,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; padding-bottom: 40px;
  }
  .mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* Top market bar — left padding reserved so the fixed hamburger button never overlaps the NQ chip */
  #pulse-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; row-gap: 6px;
    background: rgba(15,23,42,0.96); border-bottom: 1px solid var(--border);
    padding: 10px 14px 10px 46px; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  }

  /* Hamburger nav — a separate fixed element, never touched by pulse-bar's own
     periodic innerHTML re-render, so it survives every 15s poll untouched. */
  #hamburger-btn {
    position: fixed; top: 8px; left: 10px; z-index: 300;
    width: 30px; height: 30px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; cursor: pointer; user-select: none;
  }
  #hamburger-btn:hover { background: rgba(255,255,255,0.12); }
  #nav-menu {
    display: none; position: fixed; top: 44px; left: 10px; z-index: 300;
    background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; min-width: 190px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  #nav-menu.open { display: block; }
  #nav-menu a {
    display: block; padding: 8px 10px; border-radius: 6px; font-size: 13px;
    color: var(--text); text-decoration: none; cursor: pointer;
  }
  #nav-menu a:hover { background: rgba(255,255,255,0.06); }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03); flex-shrink: 0;
  }
  .chip .lbl { font-size: 11px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .chip .val { font-size: 14px; font-weight: 700; }
  .chip .sub { font-size: 11px; font-weight: 700; text-transform: uppercase; }

  /* Container */
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px; }

  /* Active setup card */
  #setup-card {
    border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 14px;
    background: rgba(15,23,42,0.4); min-height: 60px; margin-bottom: 14px;
  }
  #setup-card.long  { border-color: var(--green); background: rgba(34,197,94,0.07); }
  #setup-card.short { border-color: var(--red); background: rgba(239,68,68,0.07); }
  .setup-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .setup-type { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; flex: 1; }
  .setup-time { font-size: 12px; color: var(--dim); }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; }
  .setup-grid .k { color: var(--muted); }
  .setup-mins { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .empty-card { font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; height: 40px; }

  /* Session timeline */
  #timeline-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #timeline-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
  #timeline-stats { display: flex; gap: 14px; font-size: 13px; margin-bottom: 12px; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid var(--border); }
  #timeline-stats span b { font-family: monospace; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid rgba(51,65,85,0.3); font-size: 13px;
    cursor: pointer; transition: background 0.1s;
  }
  .row:hover { background: rgba(255,255,255,0.03); }
  .row .rdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .row .time { color: var(--dim); font-size: 12px; width: 56px; flex-shrink: 0; }
  .row .type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .price { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
  .badge.win { color: var(--green); background: rgba(34,197,94,0.12); }
  .badge.loss { color: var(--red); background: rgba(239,68,68,0.12); }
  .badge.other { color: var(--dim); background: rgba(148,163,184,0.1); }

  /* Modal */
  #modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65); align-items: center; justify-content: center; padding: 16px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #modal .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  #modal .m-title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  #modal .m-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px; }
  #modal .m-sub { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .m-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(51,65,85,0.25); font-size: 13px; }
  .m-row:last-child { border-bottom: none; }
  .m-row .m-k { color: var(--muted); }
  .m-row .m-v { font-weight: 600; }
  .m-section { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 4px; }
  .m-section:first-of-type { margin-top: 4px; }

  .loading { text-align: center; color: var(--dim); padding: 30px 0; font-size: 13px; }

  /* Aggregation sections */
  .section-block { margin-top: 26px; }
  .section-block h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
  table.agg { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.agg th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; padding: 0 6px 6px; }
  table.agg th.num, table.agg td.num { text-align: right; }
  table.agg td { padding: 6px 6px; border-top: 1px solid rgba(51,65,85,0.25); }
  table.agg tr.total td { border-top: 1px solid var(--border); font-weight: 700; padding-top: 8px; }
  .setup-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; display: inline-block; vertical-align: bottom; }

  canvas.equity { width: 100%; height: 140px; display: block; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }

  .range-filter { display: flex; gap: 6px; margin-bottom: 8px; }
  .range-btn {
    flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--muted); font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all 0.12s;
  }
  .range-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .range-btn.active { background: rgba(99,102,241,0.18); border-color: rgba(99,102,241,0.5); color: #a5b4fc; }
  .range-label { font-size: 11px; color: var(--dim); margin-bottom: 14px; }

  /* Performance section: ONE equity curve/stats row/table, switched via a Live/All toggle
     -- not two always-visible charts (tried 2026-08-13, reverted same day per direct user
     request: "I want the equity chart with live to show when i toggle live and i want the
     equity chart for all when i toggle all"). "Live" = origin_status='ACTIVE' only (real
     alerts). "All" = every row for the period regardless of origin_status, i.e. live +
     SHADOW (background-tracked, never alerted) + BACKFILL/UNKNOWN (synthetic). Both
     populations are still fetched in parallel per range change (loadRange()) so switching
     the toggle is an instant client-side re-render, no extra network round trip. */
  .perf-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .perf-subhead { font-size: 12.5px; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 6px; }
  .perf-subcount { font-size: 11px; font-weight: 500; color: var(--dim); }
  .perf-toggle { display: flex; gap: 1px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .perf-toggle button { padding: 3px 9px; font-size: 10px; font-weight: 600; cursor: pointer; border: none; background: rgba(15,23,42,0.8); color: var(--dim); }
  .perf-toggle button.active { background: rgba(51,65,85,0.6); color: var(--text); }
  .range-stats-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-bottom: 10px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="hamburger-btn" onclick="toggleNavMenu()">☰</div>
<div id="nav-menu">
  <a onclick="jumpTo('top')">Market Pulse</a>
  <a onclick="jumpTo('setup-card')">Active Setup</a>
  <a onclick="jumpTo('timeline-head')">Session Timeline</a>
  <a onclick="jumpTo('sec-performance')">Performance</a>
</div>

<div id="pulse-bar"></div>

<div class="wrap">
  <div id="setup-card"><div class="empty-card">Loading…</div></div>

  <div id="timeline-head">
    <h2 id="timeline-title">Session Timeline</h2>
  </div>
  <div id="timeline-stats"></div>
  <div id="timeline-list"><div class="loading">Loading…</div></div>

  <div class="section-block" id="sec-performance">
    <h2>Performance</h2>
    <div id="range-filter" class="range-filter">
      <button class="range-btn" data-range="today">Today</button>
      <button class="range-btn" data-range="week">Week</button>
      <button class="range-btn" data-range="month">Month</button>
      <button class="range-btn" data-range="year">Year</button>
      <button class="range-btn" data-range="all">All</button>
    </div>
    <div id="range-label" class="range-label"></div>

    <div class="perf-head-row">
      <div class="perf-subhead">Performance <span id="perf-subcount" class="perf-subcount"></span></div>
      <div id="perf-toggle" class="perf-toggle"></div>
    </div>
    <div id="range-stats" class="range-stats-row"></div>
    <canvas id="range-equity" class="equity"></canvas>
    <div id="range-agg" style="margin-top:14px;"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="modal-backdrop">
  <div id="modal"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function fmtPct(n) { return (n > 0 ? '+' : '') + n; }
function sigmaColor(s) {
  const abs = Math.abs(s || 0);
  return abs >= 1.5 ? 'var(--amber)' : abs >= 1 ? '#fb923c' : 'var(--dim)';
}

// ---- Top market pulse bar ----
async function loadPulse() {
  try {
    const [pulseRes, setupRes, ctxRes] = await Promise.all([
      fetch('/api/market/pulse').then(r => r.json()).catch(() => null),
      fetch('/api/acd/setup-detection').then(r => r.json()).catch(() => null),
      fetch('/api/morning-brief/live-session-context/' + todayET()).then(r => r.json()).catch(() => null),
    ]);
    renderPulseBar(pulseRes, setupRes, ctxRes);
    renderSetupCard(setupRes);
  } catch (e) { /* keep last good render */ }
}

function todayET() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

// Current session's own trade_date -- mirrors server/routes/acd.js's nextTradingDay() +
// /api/setups/today-summary's currentSessionDate logic exactly. FIXED 2026-08-09: the
// Session Timeline used to show BOTH today's RTH trade_date AND (once >=6PM ET) the next
// session's trade_date simultaneously (that's /api/setups/today's own, deliberately wider,
// "today + tomorrow" contract -- still correct for that endpoint's other use), so from 6PM
// until local midnight the timeline kept accumulating the day that had already closed
// instead of resetting the moment the new Globex session opened. User-reported: "the trades
// dont reset from the trade day... they keep going until midnight... should reset at the
// 6pm est globex start." Fixed by filtering client-side to ONE trade_date -- the session
// that's actually open right now -- rather than changing /api/setups/today's contract
// (only this page consumes it; grepped 2026-08-09, confirmed the only caller).
function nextTradingDayET(nowET) {
  const d = new Date(nowET);
  d.setDate(d.getDate() + 1);
  if (d.getDay() === 0) d.setDate(d.getDate() + 1); // Sun -> Mon
  if (d.getDay() === 6) d.setDate(d.getDate() + 2); // Sat -> Mon
  return d.toLocaleDateString('en-CA');
}
function currentSessionDateET() {
  const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  return nowET.getHours() >= 18 ? nextTradingDayET(nowET) : todayET();
}

function renderPulseBar(pulse, setupData, ctx) {
  if (!pulse || pulse.error) return;
  const chips = [];

  const fromOpenStr = pulse.ptsFromOpen != null ? fmtPct(pulse.ptsFromOpen.toFixed(0)) + 'pt' : '—';
  const fromOpenClr = pulse.ptsFromOpen == null ? 'var(--dim)' : pulse.ptsFromOpen > 0 ? 'var(--green)' : pulse.ptsFromOpen < 0 ? 'var(--red)' : 'var(--dim)';
  chips.push(chip('NQ', pulse.currentPrice ? pulse.currentPrice.toFixed(2) : '—', fromOpenStr, fromOpenClr, 'var(--text)'));

  const moveColor = pulse.rangeClass === 'EXTENDED' ? 'var(--red)' : pulse.rangeClass === 'QUIET' ? 'var(--dim)' : 'var(--amber)';
  const rangeLabel = pulse.rangeClass === 'EXTENDED' ? 'BIG' : pulse.rangeClass === 'QUIET' ? 'QUIET' : 'NORMAL';
  chips.push(chip('Range', pulse.sessionRange ? pulse.sessionRange.toFixed(0) + 'pt' : '—', rangeLabel, moveColor, moveColor));

  const deltaColor = pulse.deltaClass === 'HIGH' ? (pulse.deltaSign === 'BUYING' ? 'var(--green)' : 'var(--red)') : 'var(--muted)';
  const deltaArrow = pulse.deltaSign === 'BUYING' ? '▲' : pulse.deltaSign === 'SELLING' ? '▼' : '—';
  chips.push(chip('CumΔ', pulse.sessionDelta != null ? deltaArrow + ' ' + Math.abs(pulse.sessionDelta).toLocaleString() : '—', pulse.deltaClass !== 'NORMAL' ? pulse.deltaClass : '', deltaColor, deltaColor));

  if (pulse.rvol != null) {
    const rvolColor = pulse.rvolSigma >= 2 ? 'var(--red)' : pulse.rvolSigma >= 1 ? 'var(--amber)' : pulse.rvolSigma < -0.5 ? 'var(--dim)' : 'var(--muted)';
    const rvolLabel = pulse.rvolSigma >= 2 ? 'EXTREME' : pulse.rvolSigma >= 1 ? 'SPIKE' : '';
    chips.push(chip('RVol', pulse.rvol.toFixed(1) + '×', rvolLabel, rvolColor, rvolColor));
  }

  // Size chip
  const setup = setupData?.setup && !setupData.setup.isExpired ? setupData.setup : null;
  const mult = setup?.standDown ? 0 : (setup?.sizeMultiplier ?? null);
  if (setup != null && mult !== null) {
    const base = parseInt(localStorage.getItem('baseContracts') || '2');
    const rec = mult === 0 ? 0 : Math.max(1, Math.round(base * mult));
    const vColor = setup.standDown || mult === 0 ? 'var(--red)' : mult >= 1.1 ? 'var(--green)' : mult >= 0.85 ? '#60a5fa' : mult >= 0.5 ? 'var(--amber)' : '#f97316';
    chips.push(chip('Size', base + ' → ' + (rec === 0 ? 'SKIP' : rec + ' ct'), '(' + mult.toFixed(2) + '×)', vColor, vColor));
  }

  if (ctx && !ctx.noData) {
    if (ctx.sessionChar) {
      const cc = ctx.sessionChar === 'EXTREME_CHOP' ? 'var(--red)' : ctx.sessionChar === 'CHOP' ? 'var(--amber)' : ctx.sessionChar.includes('TREND') ? 'var(--green)' : 'var(--dim)';
      chips.push(chip('Session', ctx.sessionChar.replace(/_/g, ' '), '', cc, cc));
    }
    if (ctx.dailyVwapSigma != null) {
      const clr = sigmaColor(ctx.dailyVwapSigma);
      chips.push(chip('RVWAP', fmtPct(ctx.dailyVwapSigma) + 'σ', '', clr, clr));
    }
    if (ctx.vwap24Sigma != null) {
      const clr = sigmaColor(ctx.vwap24Sigma);
      chips.push(chip('24H', fmtPct(ctx.vwap24Sigma) + 'σ', '', clr, clr));
    }
    if (ctx.weeklyVwapSigma != null) {
      const clr = sigmaColor(ctx.weeklyVwapSigma);
      chips.push(chip('WK VWAP', fmtPct(ctx.weeklyVwapSigma) + 'σ', '', clr, clr));
    }
  }

  $('pulse-bar').innerHTML = chips.join('');
}

function chip(label, val, sub, subColor, valColor) {
  return '<div class="chip"><span class="lbl">' + label + '</span>' +
    '<span class="val mono" style="color:' + (valColor || 'var(--text)') + '">' + val + '</span>' +
    (sub ? '<span class="sub" style="color:' + subColor + '">' + sub + '</span>' : '') +
    '</div>';
}

// ---- Active setup card ----
function renderSetupCard(setupData) {
  const el = $('setup-card');
  const active = setupData?.setup && !setupData.setup.isExpired ? setupData.setup : null;
  if (!active) {
    el.className = '';
    el.innerHTML = '<div class="empty-card">Watching — no setup</div>';
    return;
  }
  const isLong = (active.type || '').includes('LONG') || (active.type || '').includes('BULLISH');
  el.className = isLong ? 'long' : 'short';
  const color = isLong ? 'var(--green)' : 'var(--red)';
  const rr = (active.entry && active.stop && active.target && Math.abs(active.entry - active.stop) > 0)
    ? (Math.abs(active.target - active.entry) / Math.abs(active.entry - active.stop)).toFixed(1) : null;

  let html = '<div class="setup-head">';
  html += '<span class="dot" style="background:' + color + (active.minsRemaining != null && active.minsRemaining <= 0 ? ';animation:none' : '') + '"></span>';
  html += '<span class="setup-type" style="color:' + color + '">' + (active.type || '').replace(/_/g, ' ') + '</span>';
  html += '<span class="setup-time mono">fired ' + (active.detectedAt || '') + ' ET</span>';
  html += '</div>';
  html += '<div class="setup-grid">';
  if (active.entry != null)  html += '<span class="k">Entry <b class="mono" style="color:var(--text)">' + Math.round(active.entry) + '</b></span>';
  if (active.stop != null)   html += '<span class="k">Stop <b class="mono" style="color:var(--red)">' + Math.round(active.stop) + '</b></span>';
  if (active.target != null) html += '<span class="k">T1 <b class="mono" style="color:var(--green)">' + Math.round(active.target) + '</b></span>';
  if (rr != null)             html += '<span class="k">R:R <b class="mono" style="color:#cbd5e1">' + rr + '</b></span>';
  html += '</div>';
  if (active.minsRemaining != null) {
    html += '<div class="setup-mins" style="color:' + (active.minsRemaining < 10 ? 'var(--amber)' : 'var(--dim)') + '">' + active.minsRemaining + 'm remaining</div>';
  }
  el.innerHTML = html;
}

// ---- Session timeline ----
// COMMISSION/PNL_PER_POINT match server/routes/acd.js's live resolution constants exactly
// (CLAUDE.md hard rule: this journal trades MNQ, $2/pt, $2 round-trip commission / $1 per
// side -- never copy a different $/pt or commission constant; ground truth is
// server/config/instruments.js's LIVE_INSTRUMENT.commissionPerRoundTrip, imported by
// acd.js's own resolution paths as `COMMISSION`). actual_pnl is already NET of commission
// (every resolution path subtracts COMMISSION before storing it) -- "commission spent" and
// "gross P&L" below are both DERIVED from that stored net figure, not separately fetched.
// FIXED 2026-08-13: this was still 1, left over from before the 2026-08-11 commission
// correction (server/config/instruments.js's own comment: "$1 per transaction per contract
// -- entry + exit = $2 round-trip -- the prior value was wrong despite an earlier note
// claiming broker-statement verification"). This file never got updated when that fix
// shipped -- every "commission spent"/"gross P&L" figure on this page was silently
// undercounting commission by $1/trade since 2026-08-11, caught via direct user report
// ("commission in live is still $1... should be $2 round trip").
const COMMISSION_PER_TRADE = 2;

let timelineRows = []; // full setup rows (already session+filter scoped), keyed for the modal lookup
let allTimelineRows = []; // unfiltered fetch, so toggling live/all doesn't require a re-fetch
let timelineFilter = localStorage.getItem('timelineFilter') || 'live'; // 'live' | 'all'

async function loadTimeline() {
  try {
    const data = await fetch('/api/setups/today').then(r => r.json());
    allTimelineRows = Array.isArray(data?.setups) ? data.setups : [];
    renderTimeline();
  } catch (e) { /* keep last good render */ }
}

function setTimelineFilter(f) {
  timelineFilter = f;
  localStorage.setItem('timelineFilter', f);
  renderTimeline();
}

function renderTimeline() {
  const sessionDate = currentSessionDateET();
  // FIXED 2026-08-09: was showing every date /api/setups/today returned (today's RTH date
  // AND, once >=6PM ET, tomorrow's Globex date simultaneously) -- see currentSessionDateET()
  // above for the full writeup. Now scoped to the ONE session that's actually open.
  //
  // live/all toggle (added 2026-08-09, user request): 'live' = origin_status==='ACTIVE' --
  // rows that were actually shown as a real, actionable alert at the moment they fired.
  // 'all' includes SHADOW-at-fire rows too (background-tracked touches: cascade-breaker
  // audit rows, suppressed/uncalibrated candidates, cluster-dedup audit entries -- all real
  // price events the system tracked, none of them ever surfaced to the user as a trade to
  // take). CORRECTED same session: originally built a new `fired_status` column for this
  // before realizing `origin_status` (added 2026-07-17) already IS it -- every live-firing
  // INSERT site binds origin_status to the exact same ACTIVE/SHADOW value as `status` at
  // insert time, so a second column was pure duplication, and using the existing one is
  // strictly better since it's already populated back to 2026-07-17, not just from today.
  // Rows with origin_status IN ('BACKFILL','UNKNOWN') or null are excluded from 'live'
  // (genuinely never shown as a real alert, not just "unknown") and included in 'all'.
  const scoped = allTimelineRows.filter(s => s.trade_date === sessionDate);
  const resolved = scoped
    .filter(s => s.fired_at_str && s.status !== 'SHADOW' && s.status !== 'ACTIVE')
    .filter(s => timelineFilter === 'all' || s.origin_status === 'ACTIVE')
    .sort((a, b) => (b.fired_at_str || '').localeCompare(a.fired_at_str || ''));
  timelineRows = resolved;

  let wins = 0, losses = 0, netPnl = 0, commission = 0;
  for (const s of resolved) {
    if (s.resolution === 'TARGET_HIT') wins++;
    else if (s.resolution === 'STOP_HIT') losses++;
    if (s.actual_pnl != null) {
      netPnl += parseFloat(s.actual_pnl);
      commission += COMMISSION_PER_TRADE; // every non-null actual_pnl paid a real round-trip commission
    }
  }
  const grossPnl = netPnl + commission;

  $('timeline-title').textContent = 'Session Timeline (' + resolved.length + ')';
  $('timeline-head').querySelector('#timeline-toggle')?.remove();
  const toggle = document.createElement('div');
  toggle.id = 'timeline-toggle';
  toggle.style.cssText = 'display:flex;gap:1px;border-radius:6px;overflow:hidden;border:1px solid var(--border);';
  toggle.innerHTML = [['live', 'Live'], ['all', 'All']].map(([val, label]) =>
    '<button data-tf="' + val + '" style="padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;border:none;' +
    'background:' + (timelineFilter === val ? 'rgba(51,65,85,0.6)' : 'rgba(15,23,42,0.8)') + ';' +
    'color:' + (timelineFilter === val ? 'var(--text)' : 'var(--dim)') + '">' + label + '</button>'
  ).join('');
  $('timeline-head').appendChild(toggle);
  toggle.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setTimelineFilter(b.dataset.tf)));

  $('timeline-stats').innerHTML =
    '<span>Wins <b style="color:var(--green)">' + wins + '</b></span>' +
    '<span>Losses <b style="color:var(--red)">' + losses + '</b></span>' +
    '<span>Net P&L <b style="color:' + (netPnl >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (netPnl >= 0 ? '+' : '') + '$' + netPnl.toFixed(0) + '</b></span>' +
    '<span title="Gross P&L before commission">Gross <b class="mono" style="color:var(--muted)">' + (grossPnl >= 0 ? '+' : '') + '$' + grossPnl.toFixed(0) + '</b></span>' +
    '<span title="$' + COMMISSION_PER_TRADE + '/round-trip x ' + (wins + losses + (resolved.length - wins - losses)) + ' resolved">Comm <b class="mono" style="color:var(--dim)">-$' + commission.toFixed(0) + '</b></span>';

  if (resolved.length === 0) {
    $('timeline-list').innerHTML = '<div class="loading">' + (timelineFilter === 'live' ? 'No live trades fired yet this session' : 'Nothing fired yet this session') + '</div>';
    return;
  }

  $('timeline-list').innerHTML = resolved.map(s => {
    const isWin = s.resolution === 'TARGET_HIT';
    const isLoss = s.resolution === 'STOP_HIT';
    const badgeClass = isWin ? 'win' : isLoss ? 'loss' : 'other';
    const badgeText = isWin ? 'T1 ✓' : isLoss ? 'Stop ✗' :
      (s.resolution === 'TIME_EXPIRED' || s.resolution === 'SESSION_CLOSED') ? 'expired' :
      s.resolution === 'INVALIDATED' ? 'inv.' : (s.status === 'ACTIVE' ? 'live' : '—');
    const isLong = (s.setup_type || '').includes('LONG') || (s.setup_type || '').includes('BULLISH');
    const dotColor = isLong ? 'var(--green-soft)' : 'var(--red-soft)';
    const time = s.fired_at_str ? s.fired_at_str.slice(11, 16) : '';
    const timeLabel = to12Hour(time);
    const price = s.entry_zone_low != null ? '@ ' + Number(s.entry_zone_low).toLocaleString(undefined, {maximumFractionDigits: 0}) : '';
    return '<div class="row" onclick="openTradeModal(' + s.id + ')">' +
      '<span class="rdot" style="background:' + dotColor + '"></span>' +
      '<span class="time mono">' + timeLabel + '</span>' +
      '<span class="type">' + (s.setup_type || '').replace(/_/g, ' ') + '</span>' +
      '<span class="price mono">' + price + '</span>' +
      '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>';
  }).join('');
}

// ---- Trade detail modal ----
function mRow(k, v, color) {
  if (v == null || v === '') return '';
  return '<div class="m-row"><span class="m-k">' + k + '</span><span class="m-v mono" style="color:' + (color || 'var(--text)') + '">' + v + '</span></div>';
}
function mSection(label) { return '<div class="m-section">' + label + '</div>'; }

function openTradeModal(id) {
  const s = timelineRows.find(r => r.id === id);
  if (!s) return;
  const isWin = s.resolution === 'TARGET_HIT';
  const isLoss = s.resolution === 'STOP_HIT';
  const color = isWin ? 'var(--green)' : isLoss ? 'var(--red)' : 'var(--dim)';
  const pnl = s.actual_pnl != null ? parseFloat(s.actual_pnl) : null;

  let html = '<div class="m-head"><span class="m-title" style="color:' + color + '">' + (s.setup_type || '').replace(/_/g, ' ') + '</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>';
  html += '<div class="m-sub">' + (s.is_rth ? 'RTH' : 'Overnight/Globex') + ' · ' + (s.origin_status || 'UNKNOWN') + ' · id ' + s.id + '</div>';

  html += mSection('Outcome');
  html += mRow('Resolution', s.resolution, color);
  html += mRow('Method', s.resolution_method);
  html += mRow('P&L (net)', pnl != null ? (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2) : null, pnl != null ? (pnl >= 0 ? 'var(--green)' : 'var(--red)') : null);
  // Claimed vs. possible (2026-08-09, user request): pnl is net of the $2 round-trip
  // commission (server/routes/acd.js's live resolution constants) -- back out the points
  // actually captured (signedPts = (pnl + COMMISSION) / PNL_PER_POINT, valid for both a win
  // and a loss since commission is always subtracted regardless of direction) and compare
  // against mfe_points, the best favorable excursion that was actually available during the
  // trade's life. Only shown when both are known -- MAE/MFE aren't captured on every
  // resolution path (e.g. some pre-2026-07 rows, or a resolution with no price data at all).
  // FIXED 2026-08-13: was `(pnl + 1) / 2`, stale from before the 2026-08-11 commission
  // correction -- see COMMISSION_PER_TRADE's own comment above for the full incident.
  if (pnl != null && s.mfe_points != null && Number(s.mfe_points) > 0) {
    const capturedPts = (pnl + COMMISSION_PER_TRADE) / 2; // MNQ: $2/pt round-trip commission
    const pct = Math.max(0, Math.min(999, (capturedPts / Number(s.mfe_points)) * 100));
    html += mRow('Captured vs. available', capturedPts.toFixed(1) + 'pt of ' + Number(s.mfe_points).toFixed(1) + 'pt MFE (' + pct.toFixed(0) + '%)',
      pct >= 70 ? 'var(--green)' : pct >= 35 ? 'var(--amber)' : 'var(--red)');
  }
  html += mRow('Bars to resolve', s.bars_to_resolution);

  html += mSection('Levels');
  html += mRow('Entry', s.entry_zone_low != null ? Number(s.entry_zone_low).toFixed(2) : null);
  html += mRow('Stop', s.stop_level != null ? Number(s.stop_level).toFixed(2) : null, 'var(--red)');
  html += mRow('T1', s.t1_level != null ? Number(s.t1_level).toFixed(2) : null, 'var(--green)');
  html += mRow('MAE', s.mae_points != null ? Number(s.mae_points).toFixed(1) + 'pt' : null);
  html += mRow('MFE', s.mfe_points != null ? Number(s.mfe_points).toFixed(1) + 'pt' : null);

  html += mSection('Timing');
  html += mRow('Fired', s.fired_at_str);
  html += mRow('Resolved', s.resolved_at ? String(s.resolved_at).replace('T', ' ').slice(0, 19) : null);

  const hasSignals = s.bar6_checkpoint || s.bar6_exit_recommended || s.delta_confirmation_state || s.touch_quality || (s.confluence_levels_at_detection && s.confluence_levels_at_detection.length);
  if (hasSignals) {
    html += mSection('Signals at the time');
    if (s.bar6_exit_recommended) html += mRow('Bar-6', '🚨 EXIT NOW', 'var(--amber)');
    else if (s.bar6_checkpoint) html += mRow('Bar-6', s.bar6_checkpoint, s.bar6_checkpoint === 'RECOVERING' ? 'var(--green)' : 'var(--red)');
    if (s.delta_confirmation_state) html += mRow('Delta', s.delta_confirmation_state);
    if (s.touch_quality) html += mRow('Touch quality', s.touch_quality);
    if (s.confluence_levels_at_detection && s.confluence_levels_at_detection.length) html += mRow('Confluence', s.confluence_levels_at_detection.join(', '));
  }

  if (s.historical_win_rate != null) {
    html += mSection('Calibrated at detection');
    html += mRow('Historical WR', (Number(s.historical_win_rate) * 100).toFixed(0) + '%');
    html += mRow('Sample size', s.historical_sessions);
  }

  // Cluster dedup tags (2026-07-29): when several level names sit in the same price zone,
  // only one fires as the real trade -- the others still resolve for their own calibration
  // credit but get attributed here instead of counting as separate live P&L. Shown as chips
  // so it's visually distinct from the "Confluence" context row above (that's about nearby
  // levels at detection; this is specifically about other setups deduped INTO this trade).
  if (s.cluster_attributed_setups && s.cluster_attributed_setups.length) {
    html += mSection('Also represents (deduped, same zone)');
    html += '<div style="display:flex;flex-wrap:wrap;gap:5px;">' +
      s.cluster_attributed_setups.map(t => '<span style="font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(165,180,252,0.12);border:1px solid rgba(165,180,252,0.35);color:#a5b4fc;">' + t.replace(/_/g, ' ') + '</span>').join('') +
      '</div>';
  }

  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
}
function closeTradeModal() { $('modal-backdrop').classList.remove('open'); }
$('modal-backdrop').addEventListener('click', (e) => { if (e.target.id === 'modal-backdrop') closeTradeModal(); });

function to12Hour(hhmm) {
  if (!hhmm) return '';
  let [h, m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

// ---- Aggregation by setup type (shared by today + week) ----
function aggregateBySetup(rows) {
  const map = new Map();
  for (const s of rows) {
    const key = s.setup_type || 'UNKNOWN';
    if (!map.has(key)) map.set(key, { type: key, n: 0, wins: 0, losses: 0, pnl: 0 });
    const g = map.get(key);
    g.n++;
    if (s.resolution === 'TARGET_HIT') g.wins++;
    else if (s.resolution === 'STOP_HIT') g.losses++;
    if (s.actual_pnl != null) g.pnl += parseFloat(s.actual_pnl);
  }
  return [...map.values()].sort((a, b) => b.pnl - a.pnl);
}

function renderAggTable(containerId, rows) {
  const groups = aggregateBySetup(rows);
  if (!groups.length) { $(containerId).innerHTML = '<div class="loading">Nothing fired yet</div>'; return; }

  let totalN = 0, totalWins = 0, totalLosses = 0, totalPnl = 0;
  let body = groups.map(g => {
    totalN += g.n; totalWins += g.wins; totalLosses += g.losses; totalPnl += g.pnl;
    const decided = g.wins + g.losses;
    const wr = decided > 0 ? (g.wins / decided * 100).toFixed(0) + '%' : '—';
    const pnlColor = g.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    return '<tr>' +
      '<td><span class="setup-name" title="' + g.type + '">' + g.type.replace(/_/g, ' ') + '</span></td>' +
      '<td class="num mono">' + g.n + '</td>' +
      '<td class="num mono">' + wr + '</td>' +
      '<td class="num mono" style="color:' + pnlColor + '">' + (g.pnl >= 0 ? '+' : '') + '$' + g.pnl.toFixed(0) + '</td>' +
      '</tr>';
  }).join('');

  const decidedTotal = totalWins + totalLosses;
  const wrTotal = decidedTotal > 0 ? (totalWins / decidedTotal * 100).toFixed(0) + '%' : '—';
  const totalColor = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  body += '<tr class="total"><td>Total (' + groups.length + ' types)</td>' +
    '<td class="num mono">' + totalN + '</td>' +
    '<td class="num mono">' + wrTotal + '</td>' +
    '<td class="num mono" style="color:' + totalColor + '">' + (totalPnl >= 0 ? '+' : '') + '$' + totalPnl.toFixed(0) + '</td></tr>';

  $(containerId).innerHTML = '<table class="agg"><thead><tr><th>Setup</th><th class="num">N</th><th class="num">WR</th><th class="num">P&L</th></tr></thead><tbody>' + body + '</tbody></table>';
}

// ---- Equity curve (canvas, no library) — with $ Y-axis and date/time X-axis ----
function fmtAxisMoney(v) {
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  return sign + '$' + (abs >= 1000 ? (abs / 1000).toFixed(1) + 'k' : abs.toFixed(0));
}
function fmtAxisTime(firedAtStr, useTime) {
  if (!firedAtStr) return '';
  const datePart = firedAtStr.slice(0, 10);
  const timePart = firedAtStr.slice(11, 16);
  if (useTime) return to12Hour(timePart);
  const [, mo, d] = datePart.split('-');
  return mo + '/' + d;
}

// Net P&L, gross P&L, commission, and max intraday drawdown -- 2026-08-09, user request
// ("show the max drawdown... to gauge how it perform on a prop account. Need to try and
// prevent hitting DLLs" + "show the pnl, the commission spent... and the pnl net"). Max
// drawdown is peak-to-trough on the CHRONOLOGICAL cumulative P&L curve (running peak minus
// current running total, maximized over the sequence) -- the standard prop-account DLL-risk
// framing, not just "worst single loss." Reuses the exact same `decided` population (any row
// with a real, settled actual_pnl) and chronological sort as renderEquityCurve() so the two
// stay self-consistent -- computing this from a differently-filtered/ordered set would
// silently disagree with what the chart shows (this exact drift, both from the narrower
// TARGET_HIT/STOP_HIT/TIME_EXPIRED/SESSION_CLOSED filter, is what got fixed 2026-08-13).
function computeRangeStats(rows) {
  // Any row with a real, settled actual_pnl counts as "decided" -- matches Session Timeline's
  // definition exactly (renderTimeline() above), not just 4 hardcoded resolution types. Was
  // previously narrower here (TARGET_HIT/STOP_HIT/TIME_EXPIRED/SESSION_CLOSED only), silently
  // excluding INVALIDATED rows that carry a real mark-to-market actual_pnl (per the
  // resolveSetupsByPrice() fix documented in CLAUDE.md) -- Session Timeline and Performance
  // would disagree on net P&L/commission for the same day whenever one of those existed.
  const decided = rows
    .filter(s => s.actual_pnl != null)
    .sort((a, b) => (a.fired_at_str || '').localeCompare(b.fired_at_str || ''));

  let running = 0, peak = 0, maxDD = 0;
  let wins = 0, losses = 0;
  for (const s of decided) {
    running += parseFloat(s.actual_pnl);
    if (s.resolution === 'TARGET_HIT') wins++; else if (s.resolution === 'STOP_HIT') losses++;
    if (running > peak) peak = running;
    const dd = peak - running;
    if (dd > maxDD) maxDD = dd;
  }
  const netPnl = running;
  const commission = decided.length * COMMISSION_PER_TRADE;
  const grossPnl = netPnl + commission;
  return { n: decided.length, wins, losses, netPnl, grossPnl, commission, maxDD };
}

function renderRangeStats(containerId, rows) {
  const s = computeRangeStats(rows);
  if (s.n === 0) { $(containerId).innerHTML = ''; return; }
  const clr = (v) => v >= 0 ? 'var(--green)' : 'var(--red)';
  $(containerId).innerHTML =
    '<span>Net <b class="mono" style="color:' + clr(s.netPnl) + '">' + (s.netPnl >= 0 ? '+' : '') + '$' + s.netPnl.toFixed(0) + '</b></span>' +
    '<span title="Before commission">Gross <b class="mono" style="color:var(--muted)">' + (s.grossPnl >= 0 ? '+' : '') + '$' + s.grossPnl.toFixed(0) + '</b></span>' +
    '<span title="$' + COMMISSION_PER_TRADE + '/round-trip x ' + s.n + '">Comm <b class="mono" style="color:var(--dim)">-$' + s.commission.toFixed(0) + '</b></span>' +
    '<span title="Peak-to-trough on the cumulative P&L curve -- the DLL-risk figure">Max DD <b class="mono" style="color:' + (s.maxDD > 0 ? 'var(--amber)' : 'var(--dim)') + '">-$' + s.maxDD.toFixed(0) + '</b></span>';
}

function renderEquityCurve(canvasId, rows, range) {
  const canvas = $(canvasId);
  // Same "decided" definition as computeRangeStats() above -- must stay in sync or the
  // chart and the stats line above it would silently disagree on which trades count.
  const decided = rows
    .filter(s => s.actual_pnl != null)
    .sort((a, b) => (a.fired_at_str || '').localeCompare(b.fired_at_str || ''));

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (decided.length < 2) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Not enough resolved trades yet', w / 2, h / 2);
    return;
  }

  let running = 0;
  const points = [0]; // cumulative pnl values
  const times = [decided[0].fired_at_str]; // matching timestamp per point (point 0 borrows the first trade's time)
  for (const s of decided) { running += parseFloat(s.actual_pnl); points.push(running); times.push(s.fired_at_str); }

  const min = Math.min(0, ...points), max = Math.max(0, ...points);
  const valRange = (max - min) || 1;
  const padL = 52, padR = 8, padT = 10, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xAt = (i) => padL + (i / (points.length - 1)) * plotW;
  const yAt = (v) => padT + plotH - ((v - min) / valRange) * plotH;

  // Y-axis gridlines + $ labels (min, 0 if in range, max — 3-4 ticks)
  const yTicks = [...new Set([min, 0, max].filter(v => v >= min && v <= max))].sort((a, b) => a - b);
  ctx.font = '10px monospace'; ctx.textAlign = 'right';
  for (const t of yTicks) {
    const y = yAt(t);
    ctx.strokeStyle = t === 0 ? 'rgba(148,163,184,0.3)' : 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.75)';
    ctx.fillText(fmtAxisMoney(t), padL - 6, y + 3);
  }

  // X-axis date/time labels — today shows times, everything else shows dates
  const useTime = range === 'today';
  const xTickCount = Math.min(5, points.length);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(148,163,184,0.75)';
  for (let k = 0; k < xTickCount; k++) {
    const idx = xTickCount === 1 ? 0 : Math.round((k / (xTickCount - 1)) * (points.length - 1));
    const x = xAt(idx);
    ctx.fillText(fmtAxisTime(times[idx], useTime), Math.min(Math.max(x, padL + 20), w - padR - 20), h - 4);
  }

  const finalPnl = points[points.length - 1];
  const lineColor = finalPnl >= 0 ? '#4ade80' : '#f87171';
  const fillColor = finalPnl >= 0 ? 'rgba(74,222,128,0.12)' : 'rgba(248,113,113,0.12)';

  ctx.beginPath();
  points.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.lineTo(xAt(points.length - 1), yAt(0)); ctx.lineTo(xAt(0), yAt(0)); ctx.closePath();
  ctx.fillStyle = fillColor; ctx.fill();

  ctx.beginPath();
  points.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = lineColor; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
  ctx.fillText((finalPnl >= 0 ? '+' : '') + '$' + finalPnl.toFixed(0), w - padR - 2, padT + 12);
}

// ---- Performance: filterable range (today/week/month/year/all), one chart switched by
// a Live/All toggle. "Live" = origin_status='ACTIVE' only (real alerts, matches Session
// Timeline's own default). "All" = every row for the period regardless of origin_status,
// i.e. live + SHADOW (background-tracked, never alerted) + BACKFILL/UNKNOWN (synthetic).
// Both populations are fetched in parallel on every range change and cached client-side,
// so toggling Live/All is an instant re-render with no extra fetch. CHANGED 2026-08-13
// twice in the same day: first from a single curve behind a checkbox toggle to two
// always-visible stacked curves (misread "show me live and all individually" as "show both
// at once"), then reverted to this toggle per direct correction: "I want the equity chart
// with live to show when i toggle live and i want the equity chart for all when i toggle
// all" -- i.e. switch which one is shown, don't show both.
let currentRange = 'today';
let performanceFilter = localStorage.getItem('performanceFilter') || 'live'; // 'live' | 'all'
let currentRangeRowsLive = [];
let currentRangeRowsAll = [];
let currentLiveData = null, currentAllData = null;
// Guards against out-of-order responses: 'all'/'year' can scan 10,000+ rows and take far
// longer than 'today'/'week', so a slow request kicked off by an earlier tab click can
// resolve AFTER a faster request from a later click and silently overwrite the display --
// the range buttons would show the newly-clicked tab as active while the numbers/curve
// underneath are actually from the stale click. Found 2026-08-13 from a direct user report
// ("week/year/all showing data from 'all tab'"). Each call captures its own request id;
// a response is only rendered if no newer loadRange() call has started since.
let rangeRequestSeq = 0;

function subcountLabel(data) {
  const liveN = data.liveCount || 0, shadowN = data.shadowCount || 0, backfillN = data.backfillCount || 0;
  const parts = [];
  if (shadowN > 0) parts.push(shadowN.toLocaleString() + ' background');
  if (backfillN > 0) parts.push(backfillN.toLocaleString() + ' backfill/unknown');
  return { liveN, shadowN, backfillN, parts };
}

function renderPerfToggle() {
  $('perf-toggle').innerHTML = [['live', 'Live'], ['all', 'All']].map(([val, label]) =>
    '<button data-pf="' + val + '" class="' + (performanceFilter === val ? 'active' : '') + '">' + label + '</button>'
  ).join('');
  $('perf-toggle').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setPerformanceFilter(b.dataset.pf)));
}

function setPerformanceFilter(f) {
  performanceFilter = f;
  localStorage.setItem('performanceFilter', f);
  renderPerformance();
}

// Re-renders from already-fetched cached data -- no network call, so the Live/All toggle
// switches instantly.
function renderPerformance() {
  renderPerfToggle();
  const rows = performanceFilter === 'live' ? currentRangeRowsLive : currentRangeRowsAll;
  const data = performanceFilter === 'live' ? currentLiveData : currentAllData;
  if (!data) return; // nothing fetched yet

  if (performanceFilter === 'live') {
    const info = subcountLabel(data);
    $('perf-subcount').textContent = '(' + info.liveN.toLocaleString() + ' real trade' + (info.liveN === 1 ? '' : 's') + ')';
  } else {
    const info = subcountLabel(data);
    const total = info.liveN + info.shadowN + info.backfillN;
    $('perf-subcount').textContent = info.parts.length
      ? '(' + total.toLocaleString() + ' total — ' + info.liveN.toLocaleString() + ' live + ' + info.parts.join(' + ') + ')'
      : '(' + total.toLocaleString() + ' total, all live)';
  }

  renderRangeStats('range-stats', rows);
  renderAggTable('range-agg', rows);
  renderEquityCurve('range-equity', rows, currentRange);
}

async function loadRange(range) {
  currentRange = range;
  const myRequestId = ++rangeRequestSeq;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  try {
    const [liveData, allData] = await Promise.all([
      fetch('/api/setups/range-summary?range=' + range + '&origin=live').then(r => r.json()),
      fetch('/api/setups/range-summary?range=' + range + '&origin=all').then(r => r.json()),
    ]);
    if (myRequestId !== rangeRequestSeq) return; // a newer tab click/poll superseded this response -- discard

    currentRangeRowsLive = Array.isArray(liveData?.setups) ? liveData.setups : [];
    currentRangeRowsAll = Array.isArray(allData?.setups) ? allData.setups : [];
    currentLiveData = liveData;
    currentAllData = allData;
    $('range-label').textContent = liveData.rangeLabel || allData.rangeLabel || '';

    renderPerformance();
  } catch (e) { /* keep last good render */ }
}

document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => loadRange(btn.dataset.range));
});

// ---- Hamburger nav ----
function toggleNavMenu() { $('nav-menu').classList.toggle('open'); }
function jumpTo(id) {
  $('nav-menu').classList.remove('open');
  if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = $(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.addEventListener('click', (e) => {
  if (!$('nav-menu').contains(e.target) && !$('hamburger-btn').contains(e.target)) {
    $('nav-menu').classList.remove('open');
  }
});

// ---- Boot ----
loadPulse();
loadTimeline();
loadRange('today');
setInterval(loadPulse, 15000);
setInterval(loadTimeline, 20000);
setInterval(() => loadRange(currentRange), 60000);
window.addEventListener('resize', () => {
  const rows = performanceFilter === 'live' ? currentRangeRowsLive : currentRangeRowsAll;
  renderEquityCurve('range-equity', rows, currentRange);
});
</script>
</body>
</html>
