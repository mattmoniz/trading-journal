<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick Check</title>
<style>
  :root {
    /* KEEP IN SYNC with src/components/dashboard/MarketPulseBar.jsx's `C` object (2026-09-07
       duplication audit) -- these are the same semantic colors independently duplicated in
       a standalone static page vs. the bundled React app, which can't literally share one JS
       module. Found disagreeing here before this fix: --green was #22c55e vs. MarketPulseBar's
       #10b981 (a genuinely different bullish hue), and --muted/--dim were swapped relative to
       MarketPulseBar's C.muted/C.dim -- every shared threshold-color function below only agreed
       with MarketPulseBar's output by coincidence (each file picked the oppositely-named token
       that happened to resolve to the same hex). Canonicalized on MarketPulseBar's values since
       the in-app dashboard is the primary surface (quick-check is the secondary/mobile view). */
    --green: #10b981; --green-soft: #4ade80;
    --red: #ef4444; --red-soft: #f87171;
    --amber: #f59e0b; --amber-soft: #fbbf24;
    --muted: #64748b; --dim: #94a3b8;
    --text: #e2e8f0;
    --bg: #0b1120; --card: rgba(15,23,42,0.7);
    --border: rgba(51,65,85,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; padding-bottom: 40px;
  }
  .mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* Top market bar — left padding reserved so the fixed hamburger button never overlaps the NQ chip */
  #pulse-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; row-gap: 6px;
    background: rgba(15,23,42,0.96); border-bottom: 1px solid var(--border);
    padding: 10px 14px 10px 46px; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  }

  /* Hamburger nav — a separate fixed element, never touched by pulse-bar's own
     periodic innerHTML re-render, so it survives every 15s poll untouched. */
  #hamburger-btn {
    position: fixed; top: 8px; left: 10px; z-index: 300;
    width: 30px; height: 30px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; cursor: pointer; user-select: none;
  }
  #hamburger-btn:hover { background: rgba(255,255,255,0.12); }
  #nav-menu {
    display: none; position: fixed; top: 44px; left: 10px; z-index: 300;
    background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; min-width: 190px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  #nav-menu.open { display: block; }
  #nav-menu a {
    display: block; padding: 8px 10px; border-radius: 6px; font-size: 13px;
    color: var(--text); text-decoration: none; cursor: pointer;
  }
  #nav-menu a:hover { background: rgba(255,255,255,0.06); }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03); flex-shrink: 0;
  }
  .chip .lbl { font-size: 11px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .chip .val { font-size: 14px; font-weight: 700; }
  .chip .sub { font-size: 11px; font-weight: 700; text-transform: uppercase; }

  /* Standalone volatility-regime card (2026-09-08) -- deliberately its own visual block, not
     a pulse-bar chip: this reads from server/services/volatilityRegime.js, a module kept
     structurally separate from acd.js/setups.js per user direction ("not tailored to our
     setups... its own class, not acd"). Muted/quiet styling since it's informational only,
     never a live alert. */
  #vol-regime-card {
    display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02); font-size: 12px; color: var(--dim);
    cursor: pointer;
  }
  #vol-regime-card:active { background: rgba(255,255,255,0.05); }
  #vol-regime-card .vr-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
  #vol-regime-card .vr-scale { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; color: var(--text); font-weight: 700; }
  #vol-regime-card .vr-asof { margin-left: auto; font-size: 11px; }

  /* ML meta-labeling silo card (2026-09-21) -- fully isolated read-only comparison, see
     server/services/mlSiloService.js's own header for the "why isolated" account. Purple
     accent (distinct from the neutral/muted styling every other informational card here
     uses) since this is a genuinely different kind of thing -- a whole parallel system
     being evaluated, not a passive descriptive reading. */
  #ml-silo-card {
    display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap;
    padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(168,85,247,0.35);
    background: rgba(168,85,247,0.06); font-size: 12px; color: var(--dim);
    cursor: pointer;
  }
  #ml-silo-card:active { background: rgba(168,85,247,0.12); }
  #ml-silo-card .ml-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; color: #d8b4fe; }
  #ml-silo-card .ml-stat { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-weight: 700; }

  /* Live pulse-reading card (2026-09-09) -- see server/services/pulseReading.js's header: this
     is a raw, live "is volume accelerating or decelerating" read, NOT a validated trading
     signal (RESEARCH_CLAIM pulse_vwap_slope_direction_negative_20260909 found it doesn't
     reliably predict direction). Deliberately muted/neutral, matching the volatility card's
     own honest-descriptive styling. */
  #pulse-reading-card {
    display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02); font-size: 12px; color: var(--dim);
  }
  #pulse-reading-card .pr-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
  #pulse-reading-card .pr-state { font-weight: 700; }
  #pulse-reading-card .pr-state.up { color: var(--green); }
  #pulse-reading-card .pr-state.down { color: var(--dim); }
  #pulse-reading-card .pr-note { margin-left: auto; font-size: 10px; color: var(--dim); }

  /* Container */
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px; }

  /* Active setup card -- hidden by default (2026-09-16, user request: "remove that box that
     says watching - no setup"), same display:none/.visible toggle convention as #sweep-watch
     below, so it only ever takes up space when there's a real active setup to show. */
  #setup-card {
    display: none;
    border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 14px;
    background: rgba(15,23,42,0.4); min-height: 60px; margin-bottom: 14px;
  }
  #setup-card.visible { display: block; }
  #setup-card.long  { border-color: var(--green); background: rgba(34,197,94,0.07); }
  #setup-card.short { border-color: var(--red); background: rgba(239,68,68,0.07); }
  /* shadow-only override (2026-09-21, user-caught live: a deliberately-suppressed setup type
     -- IB_BULLISH, killed 2026-08-31 -- rendered with IDENTICAL green "act on this" styling
     as a real ACTIVE fire, since this card never distinguished origin_status before). Same
     amber "not a trusted signal" language as #sweep-watch below, applied here too -- wins
     over .long/.short via source order (this rule comes after them). */
  #setup-card.shadow-only { border-color: rgba(245,158,11,0.4) !important; background: rgba(245,158,11,0.06) !important; }
  .setup-shadow-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); background: rgba(245,158,11,0.15); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; margin-left: 6px; }

  /* Standalone-detector open position (2026-09-21, user request: "why didn't this other live
     trade fire like this on my screen" -- MOMENTUM_CHASE/MAJOR_PIVOT_DEFENDED_BREAK/
     STALL_DEFENDED_LEVEL/MINOR_DEFENDED_LEVEL had no "show my currently-open position"
     mechanism at all, unlike #setup-card). Reuses the exact same shadow-only amber language
     -- these 4 detectors are all real_n<20/SHADOW-only, never a trusted live signal. */
  #standalone-position-card { display: none; border: 1.5px solid rgba(245,158,11,0.4); border-radius: 8px; padding: 12px 14px; background: rgba(245,158,11,0.06); margin-bottom: 14px; }
  #standalone-position-card.visible { display: block; }
  .setup-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .setup-type { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; flex: 1; }
  .setup-time { font-size: 12px; color: var(--dim); }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; }
  .setup-grid .k { color: var(--muted); }
  .setup-mins { font-size: 12px; color: var(--dim); margin-top: 6px; }

  /* Sweep-reversal watch card (2026-08-25, direct user request: "I'd rather see it fire
     live and shadow" for the new SWEEP_REVERSAL_LONG/SHORT_OVERNIGHT mechanism). Reuses
     #setup-card's visual language (same border/grid shape) but stays visually distinct via
     the amber "WATCHING" tag -- this is a brand-new, unproven, SHADOW-only mechanism (see
     RESEARCH_CLAIM globex_sweep_reversal_size_filter_dose_response), never promoted to a
     real alert, so it must never be mistaken for a trusted signal like #setup-card's
     contents. Hidden entirely (display:none) when nothing has fired today -- deliberately
     does not show an "empty" placeholder the way #setup-card does, since this is meant to
     be a rare, notable event, not a permanent fixture of the page. */
  #sweep-watch { display: none; border: 1.5px solid rgba(245,158,11,0.4); border-radius: 8px; padding: 12px 14px; background: rgba(245,158,11,0.06); margin-bottom: 14px; }
  #sweep-watch.visible { display: block; }
  .sweep-watch-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); background: rgba(245,158,11,0.15); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
  .sweep-watch-note { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.5; }

  /* Session timeline */
  #timeline-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #timeline-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
  #timeline-stats { display: flex; gap: 14px; font-size: 13px; margin-bottom: 12px; padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid var(--border); }
  #vb-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #timeline-stats span b { font-family: monospace; }

  .row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid rgba(51,65,85,0.3); font-size: 13px;
    cursor: pointer; transition: background 0.1s;
  }
  .row:hover { background: rgba(255,255,255,0.03); }
  .row .rdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .row .time { color: var(--dim); font-size: 12px; width: 56px; flex-shrink: 0; }
  .row .type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .price { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
  .badge.win { color: var(--green); background: rgba(34,197,94,0.12); }
  .badge.loss { color: var(--red); background: rgba(239,68,68,0.12); }
  .badge.other { color: var(--dim); background: rgba(148,163,184,0.1); }
  /* Volume-building tracking tag (2026-08-28) -- deliberately NEUTRAL (slate, not green/red):
     this signal has NOT been validated (walk-forward test failed out-of-sample, see
     fade_roster_volume_building_walkforward_negative RESEARCH_CLAIM) -- it's a tracking marker
     for accumulating more real data, not an endorsement of the trade. */
  .vb-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
  .vb-tag.strong { color: #93c5fd; background: rgba(59,130,246,0.14); }
  .vb-tag.mild { color: #94a3b8; background: rgba(148,163,184,0.08); }
  .wide-tag { color: #c4b5fd; background: rgba(139,92,246,0.14); }
  /* Cluster tag (2026-09-14, replaces the 2026-09-08 leader/collapsed-sibling dropdown -- user
     request, after finding the collapse relied on is_cluster_primary picking a display leader,
     which silently hid a row entirely whenever a cluster had NO member flagged primary (a real,
     confirmed bug, not just a UX preference). A confluence touch's real siblings (shared
     cluster_touch_id, each its own real SHADOW row for its OWN calibration credit, never a
     second real trade) now ALWAYS render as their own normal top-level rows, in plain
     chronological order, same as any other trade -- nothing is ever hidden or collapsed. This
     tag is purely an identifying marker so same-instant siblings still read as linked; tapping
     it opens a popup listing every member of the group, it does not toggle visibility of
     anything. */
  .cluster-tag { color: #a5b4fc; background: rgba(165,180,252,0.12); border: 1px solid rgba(165,180,252,0.35); cursor: pointer; }
  /* range_slope/vol_rollover post-entry exit-signal tags (OPEN_DECISION
     wire_flush_post_entry_exit_signals_globex) -- same restrained, non-green/red palette as
     the tags above since these are unvalidated too (PROVISIONAL until the weekly promotion
     script confirms real N>=20). Distinct hues from strong/mild/wide-tag so all 4 tag kinds
     stay visually distinguishable at a glance. */
  .rangeslope-tag { color: #fcd34d; background: rgba(217,119,6,0.14); }
  .volroll-tag { color: #5eead4; background: rgba(20,184,166,0.14); }
  /* step-trail runner extension shadow tag (Opus Audit #12, 2026-09-04) -- distinct hue from
     the 4 tag kinds above so all 5 stay visually distinguishable at a glance. Also unvalidated
     (SHADOW-tracked only, OPEN_DECISION step_trail_phase2_promotion_pending). */
  .steptrail-tag { color: #f9a8d4; background: rgba(219,39,119,0.14); }
  /* Pitch and Catch shadow tag (2026-09-04) -- distinct hue from the 5 tag kinds above so
     all 6 stay visually distinguishable. UNVALIDATED (tracked at explicit user request). */
  .pitchcatch-tag { color: #86efac; background: rgba(22,163,74,0.14); }
  /* Direction-loss-alternation gate tag (2026-09-05) -- distinct hue from the 6 tag kinds
     above. Observation-only (OPEN_DECISION direction_alternation_after_loss_gate_pending) --
     only shown on trades that WOULD have been blocked, not every tagged row. */
  .dirgate-tag { color: #fca5a5; background: rgba(220,38,38,0.16); }
  /* Momentum-against-fade shadow tag (2026-09-05) -- observation-only
     (OPEN_DECISION momentum_against_fade_sizemultiplier_wiring_pending). Only shown when
     this trade's own reading cleared the calibrated top-quartile "against" cutoff. */
  .momfade-tag { color: #fdba74; background: rgba(234,88,12,0.16); }
  /* Breakeven-stop-on-order-flow-rejection shadow tag (2026-09-16) -- distinct hue from the 7
     tag kinds above. Only shown on the REWARDED-classified subset (see breakevenStopShadow.js). */
  .breakevenstop-tag { color: #7dd3fc; background: rgba(2,132,199,0.16); }
  /* Entry-order-flow shadow tag (2026-09-16, entryOrderFlowShadow.js) -- one shared color for
     both the LONG and SHORT rule (the tag TEXT distinguishes them, "EntryFlow-L"/"EntryFlow-S").
     Only shown when wouldBeFlagged is true. */
  .entryflow-tag { color: #d8b4fe; background: rgba(147,51,234,0.16); }
  /* Late-backfill tag (OPEN_DECISION poller_late_backfill_display_gap_20260914) -- shown
     when a "own poller, stateless by design" detector (pocRotationJoinDetector.js/
     globexFlushDetector.js/etc) inserted this row long after its own fired_at, typically
     because a server restart mid-session wiped the detector's in-memory poll-skip cache.
     Duration is shown directly in the tag text (not hidden behind a hover title) so a
     mobile/touchscreen viewer sees it without needing to tap anything. */
  .late-tag { color: #fde68a; background: rgba(202,138,4,0.16); }
  .sig-tag { cursor: pointer; }

  /* Modal */
  #modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.65); align-items: center; justify-content: center; padding: 16px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #modal .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  #modal .m-title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  #modal .m-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px; }
  #modal .m-sub { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .m-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(51,65,85,0.25); font-size: 13px; }
  .m-row:last-child { border-bottom: none; }
  .m-row .m-k { color: var(--muted); }
  .m-row .m-v { font-weight: 600; }
  .m-section { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 4px; }
  .m-section:first-of-type { margin-top: 4px; }

  .loading { text-align: center; color: var(--dim); padding: 30px 0; font-size: 13px; }

  /* Aggregation sections */
  .section-block { margin-top: 26px; }
  .section-block h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
  table.agg { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.agg th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; padding: 0 6px 6px; }
  table.agg th.num, table.agg td.num { text-align: right; }
  table.agg td { padding: 6px 6px; border-top: 1px solid rgba(51,65,85,0.25); }
  table.agg tr.total td { border-top: 1px solid var(--border); font-weight: 700; padding-top: 8px; }
  .setup-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; display: inline-block; vertical-align: bottom; }

  canvas.equity { width: 100%; height: 140px; display: block; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }

  .range-filter { display: flex; gap: 6px; margin-bottom: 8px; }
  .range-btn {
    flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); color: var(--muted); font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all 0.12s;
  }
  .range-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .range-btn.active { background: rgba(99,102,241,0.18); border-color: rgba(99,102,241,0.5); color: #a5b4fc; }
  .range-label { font-size: 11px; color: var(--dim); margin-bottom: 14px; }

  /* Performance section: ONE equity curve/stats row/table, switched via a Live/All toggle
     -- not two always-visible charts (tried 2026-08-13, reverted same day per direct user
     request: "I want the equity chart with live to show when i toggle live and i want the
     equity chart for all when i toggle all"). "Live" = origin_status='ACTIVE' only (real
     alerts). "All" = every row for the period regardless of origin_status, i.e. live +
     SHADOW (background-tracked, never alerted) + BACKFILL/UNKNOWN (synthetic). Both
     populations are still fetched in parallel per range change (loadRange()) so switching
     the toggle is an instant client-side re-render, no extra network round trip. */
  .perf-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .perf-subhead { font-size: 12.5px; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 6px; }
  .perf-subcount { font-size: 11px; font-weight: 500; color: var(--dim); }
  .perf-toggle { display: flex; gap: 1px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .perf-toggle button { padding: 3px 9px; font-size: 10px; font-weight: 600; cursor: pointer; border: none; background: rgba(15,23,42,0.8); color: var(--dim); }
  .perf-toggle button.active { background: rgba(51,65,85,0.6); color: var(--text); }
  .range-stats-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-bottom: 10px; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="hamburger-btn" onclick="toggleNavMenu()">☰</div>
<div id="nav-menu">
  <a onclick="jumpTo('top')">Market Pulse</a>
  <a onclick="jumpTo('setup-card')">Active Setup</a>
  <a onclick="jumpTo('timeline-head')">Session Timeline</a>
  <a onclick="jumpTo('sec-performance')">Performance</a>
  <a href="/setup-performance">Setup Performance →</a>
  <a href="/loss-prevention">Loss Prevention →</a>
  <a onclick="jumpTo('ml-silo-card')">ML Silo</a>
</div>

<div id="pulse-bar"></div>

<div class="wrap">
  <div id="vol-regime-card" onclick="openVolRegimeHistoryModal()"></div>
  <div id="ml-silo-card" onclick="openMlSiloModal()"></div>
  <div id="pulse-reading-card"></div>
  <div id="setup-card"></div>
  <div id="standalone-position-card"></div>
  <div id="sweep-watch"></div>

  <div id="timeline-head">
    <h2 id="timeline-title">Session Timeline</h2>
  </div>
  <div id="vb-filter-row"></div>
  <div id="timeline-stats"></div>
  <div id="timeline-list"><div class="loading">Loading…</div></div>

  <div class="section-block" id="sec-performance">
    <h2>Performance</h2>
    <div id="range-filter" class="range-filter">
      <button class="range-btn" data-range="today">Today</button>
      <button class="range-btn" data-range="week">Week</button>
      <button class="range-btn" data-range="month">Month</button>
      <button class="range-btn" data-range="year">Year</button>
      <button class="range-btn" data-range="all">All</button>
    </div>
    <div id="range-label" class="range-label"></div>

    <div class="perf-head-row">
      <div class="perf-subhead">Performance <span id="perf-subcount" class="perf-subcount"></span></div>
      <div id="perf-toggle" class="perf-toggle"></div>
    </div>
    <div id="range-stats" class="range-stats-row"></div>
    <canvas id="range-equity" class="equity"></canvas>
    <div id="range-agg" style="margin-top:14px;"><div class="loading">Loading…</div></div>
  </div>
</div>

<div id="modal-backdrop">
  <div id="modal"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// Sign at exactly 0 matches MarketPulseBar.jsx's `ptsFromOpen >= 0 ? '+' : ''` (>= not >) --
// found disagreeing (no '+' at exactly 0pt here vs. '+0pt' there) in the 2026-09-07 audit.
function fmtPct(n) { return (n >= 0 ? '+' : '') + n; }
// KEEP IN SYNC with MarketPulseBar.jsx's sigmaColor() -- same 1.5σ/1σ thresholds, duplicated
// because this is a standalone page that can't import that module.
function sigmaColor(s) {
  const abs = Math.abs(s || 0);
  return abs >= 1.5 ? 'var(--amber)' : abs >= 1 ? '#fb923c' : 'var(--muted)';
}

// ---- Top market pulse bar ----
// Standalone volatility-regime card (2026-09-08) -- deliberately its own fetch, not bundled
// into loadPulse()'s Promise.all with the other ACD-related endpoints, matching the same
// "not acd" separation server/services/volatilityRegime.js's header describes. Refreshes
// every 5 minutes: the underlying reading only changes once per night (run_daily_calibration.sh),
// so anything faster would just be re-fetching an unchanged value.
//
// NO qualitative HOT/WARM/NORMAL/COOL/COLD label -- shipped with one, removed same day after
// directly testing whether it predicted next-day realized moves (it didn't: non-monotonic,
// weak correlation ~0.14-0.15, see volatilityRegime.js's header for the full writeup). Shows
// the raw scale only -- an honest description of the reading, not a predictive claim.
async function loadVolRegime() {
  try {
    const data = await fetch('/api/volatility/regime').then(r => r.json());
    renderVolRegimeCard(data?.regime || null, data?.favorableSetups || []);
  } catch (e) { /* keep last good render */ }
}
// favorableSetups (2026-09-09, direct user request: "add which setups would be successful in
// today's regime to this card") -- from validatedSetupRegistry.js via the route, NOT computed
// here. Only shows a line when something IS favorable today (matches #sweep-watch's own "stay
// hidden unless there's something to say" convention) -- with only one registry entry so far,
// showing "not favorable" every single day it isn't MEDIUM would just be noise.
function renderVolRegimeCard(regime, favorableSetups) {
  const el = $('vol-regime-card');
  if (!el) return;
  if (!regime) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.style.flexWrap = 'wrap';
  const favorable = (favorableSetups || []).filter(s => s.favorableToday);
  el.innerHTML =
    '<span class="vr-label">Volatility vs. recent normal</span>' +
    '<span class="vr-scale">' + regime.scale.toFixed(2) + 'x</span>' +
    (regime.degenerateFallback ? '<span title="GARCH fit was numerically degenerate today; carried forward the last valid reading">⚠</span>' : '') +
    '<span class="vr-asof">as of ' + regime.asOfClose + ' close</span>' +
    // Roll-week pause note (2026-09-14, user-caught "GARCH looks frozen"): the reading
    // genuinely can't advance during NQ's quarterly contract-roll week (see
    // volatilityRegime.js's getLatestVolRegime() for why) -- say so explicitly rather than
    // showing a stale-looking date with no context, which reads exactly like a stuck job.
    (regime.rollWeekPaused
      ? '<span style="flex-basis:100%;font-size:11px;color:var(--amber);margin-top:4px;">⏸ Paused — inside NQ\'s quarterly contract-roll window' + (regime.rollWeekResumesAfter ? ', resumes after ' + regime.rollWeekResumesAfter : '') + '</span>'
      : '') +
    (favorable.length
      ? '<span style="flex-basis:100%;font-size:11px;color:var(--green);margin-top:4px;">✓ Favors: ' + favorable.map(s => s.label).join(', ') + '</span>'
      : '');
}

// ---- Live pulse reading (2026-09-09, direct user request after the pulse/VWAP-slope research
// thread). Raw, live volume-acceleration state -- NOT a validated signal (RESEARCH_CLAIM
// pulse_vwap_slope_direction_negative_20260909 found this doesn't reliably predict direction,
// even combined with VWAP slope and price position). Shown for its own sake, same honest-
// descriptive framing as the volatility card above. Polls the same 5min cadence as that card
// -- this is a slow-moving-enough read (needs 20+ bars) that RTH-poll-speed isn't needed.
async function loadPulseReading() {
  try {
    const data = await fetch('/api/pulse/reading').then(r => r.json());
    renderPulseReadingCard(data?.pulse || null);
  } catch (e) { /* keep last good render */ }
}
function renderPulseReadingCard(pulse) {
  const el = $('pulse-reading-card');
  if (!el) return;
  // null = genuine no-data (query failed, or no session at all -- e.g. weekend/holiday).
  // WARMING_UP = a real session is running but hasn't accumulated the ~2hrs of bars this
  // measure needs yet -- shown distinctly so the card isn't indistinguishable from "broken"
  // for the first 2 hours of every trading day (found live 2026-09-09).
  if (!pulse) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  if (pulse.state === 'WARMING_UP') {
    el.innerHTML =
      '<span class="pr-label">Pulse (volume)</span>' +
      '<span class="pr-state down">Warming up</span>' +
      '<span class="pr-note">needs ~2hrs of bars (' + pulse.barsSoFar + '/' + pulse.barsNeeded + ')</span>';
    return;
  }
  const isUp = pulse.state === 'PICKING_UP';
  const label = pulse.state === 'PICKING_UP' ? 'Picking Up' : pulse.state === 'DROPPING_OFF' ? 'Dropping Off' : 'Flat';
  el.innerHTML =
    '<span class="pr-label">Pulse (volume)</span>' +
    '<span class="pr-state ' + (isUp ? 'up' : 'down') + '">' + label + '</span>' +
    '<span class="pr-note">informational only, not a signal</span>';
}

// ---- Volatility regime history popup (2026-09-08, direct user request: "is there a chart in
// quick check" -> "can i click on it and get a historical chart modal"). Same #modal/
// #modal-backdrop + mRow/mSection convention as every other popup on this page -- reuses the
// existing modal chrome rather than inventing new UI. GET /api/volatility/regime/history reads
// the SAME walk-forward series (server/services/volatilityRegime.js's getVolRegimeHistory())
// the window-choice and big-move RESEARCH_CLAIMs were validated against, not a separately
// computed convenience series.
async function openVolRegimeHistoryModal() {
  let html = '<div class="m-head"><span class="m-title">Volatility Regime History</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>' +
    '<div class="m-sub">GARCH(1,1) forecast scale vs. its own historical range -- informational only, not wired into any setup\'s stop/target/sizing</div>' +
    '<canvas id="vol-history-canvas" class="equity" style="margin-top:10px;"></canvas>' +
    '<div id="vol-history-loading" style="font-size:12px;color:var(--dim);text-align:center;padding:20px 0;">Loading…</div>';
  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');

  try {
    const data = await fetch('/api/volatility/regime/history?days=180').then(r => r.json());
    const loadingEl = $('vol-history-loading');
    if (loadingEl) loadingEl.remove();
    renderVolRegimeHistoryChart('vol-history-canvas', data?.history || [], data?.band || null);
  } catch (e) {
    const loadingEl = $('vol-history-loading');
    if (loadingEl) loadingEl.textContent = 'Failed to load history';
  }
}

// Same canvas-sizing/axis/gridline conventions as renderEquityCurve() above (dpr scaling,
// padL/padR/padT/padB layout, min/max-derived y ticks) -- plots `scale` instead of cumulative
// $, with a dashed reference line at 1.0 (this reading's own long-run "normal") instead of a
// solid one at $0, since 1.0 is a scale-relative baseline, not a break-even point the way $0 is
// for P&L.
function renderVolRegimeHistoryChart(canvasId, rows, band) {
  const canvas = $(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (!rows || rows.length < 2) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Not enough history yet', w / 2, h / 2);
    return;
  }

  const scales = rows.map(r => r.scale);
  const min = Math.min(...scales, band ? band.p01 : Infinity, 1.0);
  const max = Math.max(...scales, band ? band.p99 : -Infinity, 1.0);
  const valRange = (max - min) || 1;
  const padL = 40, padR = 8, padT = 10, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xAt = (i) => padL + (i / (rows.length - 1)) * plotW;
  const yAt = (v) => padT + plotH - ((v - min) / valRange) * plotH;

  // Y-axis gridlines + scale labels (min, 1.0 baseline, max)
  const yTicks = [...new Set([min, 1.0, max].filter(v => v >= min && v <= max))].sort((a, b) => a - b);
  ctx.font = '10px monospace'; ctx.textAlign = 'right';
  for (const t of yTicks) {
    const y = yAt(t);
    ctx.strokeStyle = t === 1.0 ? 'rgba(148,163,184,0.35)' : 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    if (t === 1.0) ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(148,163,184,0.75)';
    ctx.fillText(t.toFixed(2) + 'x', padL - 6, y + 3);
  }

  // Shaded band between this reading's own 1st/99th percentile (context, not a threshold)
  if (band) {
    ctx.fillStyle = 'rgba(148,163,184,0.06)';
    ctx.fillRect(padL, yAt(Math.min(band.p99, max)), plotW, yAt(Math.max(band.p01, min)) - yAt(Math.min(band.p99, max)));
  }

  // X-axis date labels (first, middle, last)
  const xTickCount = Math.min(5, rows.length);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(148,163,184,0.75)';
  for (let k = 0; k < xTickCount; k++) {
    const idx = xTickCount === 1 ? 0 : Math.round((k / (xTickCount - 1)) * (rows.length - 1));
    const x = xAt(idx);
    ctx.fillText(rows[idx].date.slice(5), Math.min(Math.max(x, padL + 18), w - padR - 18), h - 4);
  }

  const finalScale = scales[scales.length - 1];
  const lineColor = finalScale >= 1.0 ? '#c4b5fd' : '#94a3b8'; // muted purple/grey -- deliberately NOT green/red, this isn't a win/loss signal

  ctx.beginPath();
  scales.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = lineColor; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
  ctx.fillText(finalScale.toFixed(2) + 'x', w - padR - 2, padT + 12);
}

// ML meta-labeling silo card (2026-09-21) -- reads the SAME server/routes/mlSilo.js
// endpoints the React ML Silo view (src/views/MLSiloView.jsx) reads, deliberately never
// re-deriving the comparison aggregation here -- per the DeepSeek critique's explicit
// warning against reimplementing this kind of aggregation twice across two frontend
// surfaces. Slow-changing (verdicts backfilled daily, model retrained manually) -- same
// 5min poll cadence as the volatility card, no need for anything faster.
async function loadMlSilo() {
  try {
    const data = await fetch('/api/ml-silo/summary?sample=test').then(r => r.json());
    renderMlSiloCard(data);
  } catch (e) { /* keep last good render */ }
}
function renderMlSiloCard(data) {
  const el = $('ml-silo-card');
  if (!el) return;
  if (!data?.model || !data?.comparison) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const all = data.comparison.allTrades;
  const take = data.comparison.byVerdict?.find(v => v.verdict === 'TAKE');
  const allPnl = Number(all?.total_pnl || 0);
  const takePnl = Number(take?.total_pnl || 0);
  const fmtD = n => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(0);
  el.innerHTML =
    '<span class="ml-label">ML Silo (out-of-sample)</span>' +
    '<span>All: <span class="ml-stat" style="color:' + (allPnl >= 0 ? 'var(--green)' : 'var(--red)') + '">' + fmtD(allPnl) + '</span></span>' +
    '<span>ML-approved: <span class="ml-stat" style="color:' + (takePnl >= 0 ? 'var(--green)' : 'var(--red)') + '">' + fmtD(takePnl) + '</span></span>' +
    '<span style="margin-left:auto;font-size:11px;">tap for detail →</span>';
}

// Range-filterable ML silo modal (2026-09-21, user request: "the same views as i see here
// in this photo but for ML? With the charts pnl and different timeframes") -- mirrors the
// main Performance section's Today/Week/Month/Year/All tabs + Wins/Losses/Net/Gross/Comm/
// Worst-Trade stats row + equity curve, applied to two populations (All scored vs
// ML-Approved) instead of one account. Backed by /api/ml-silo/range-trades, which returns
// raw per-trade rows (like /api/setups/range-summary does) so this computes stats/curves
// client-side -- same division of labor as the main Performance section.
let mlSiloRange = 'today';
let mlSiloTradesCache = [];

async function openMlSiloModal() {
  let html = '<div class="m-head"><span class="m-title">ML Meta-Labeling Silo</span>' +
    '<button class="m-close" onclick="closeTradeModal()">×</button></div>' +
    '<div class="m-sub">Fully isolated -- never changes what fires as a real alert. Scored across every level individually (not collapsed to one cluster "winner"). Out-of-sample = genuinely never seen by the model during training, the only honest comparison.</div>' +
    '<div id="ml-silo-model-line" style="font-size:11px;color:var(--dim);margin-top:6px;"></div>' +
    '<div id="ml-silo-range-tabs" class="range-filter" style="margin-top:10px;"></div>' +
    '<div id="ml-silo-range-label" style="font-size:11px;color:var(--dim);margin-top:4px;"></div>' +
    '<canvas id="ml-silo-canvas" class="equity" style="margin-top:10px;"></canvas>' +
    '<div style="font-size:11px;color:#3b82f6;font-weight:700;margin-top:10px;">All Trades</div>' +
    '<div id="ml-silo-all-stats" class="range-stats-row"></div>' +
    '<div style="font-size:11px;color:#c4b5fd;font-weight:700;margin-top:8px;">ML-Approved</div>' +
    '<div id="ml-silo-take-stats" class="range-stats-row"></div>' +
    '<div id="ml-silo-step-trail" style="margin-top:14px;"></div>' +
    '<div id="ml-silo-trades" style="margin-top:10px;"></div>';
  $('modal').innerHTML = html;
  $('modal-backdrop').classList.add('open');
  await loadMlSiloRange(mlSiloRange);
  loadMlSiloStepTrail();
}

// "ML gates entry, a validated trail mechanism decides how far to let it run" -- the
// coupling step (2026-09-21, user's explicit "next step" request). NEITHER piece is
// individually validated yet (this model's own walk-forward CI crosses zero; step_trail_
// shadow's own RESEARCH_CLAIM is PROVISIONAL) -- shown here purely as a research
// comparison, clearly labeled, never as a claim either mechanism is ready. Fetched once per
// modal open, not range-scoped (the underlying population is already thin, N<30).
async function loadMlSiloStepTrail() {
  const el = $('ml-silo-step-trail');
  if (!el) return;
  try {
    const data = await fetch('/api/ml-silo/step-trail-comparison?sample=test').then(r => r.json());
    const c = data?.comparison;
    if (!c || c.n < 1) { el.innerHTML = ''; return; }
    const fmtD = n => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(0);
    const delta = c.trailTotal - c.normalTotal;
    el.innerHTML =
      '<div style="font-size:11px;color:#fbbf24;font-weight:700;">ML + Step-Trail Coupling (research only, N=' + c.n + ')</div>' +
      '<div style="font-size:11px;color:var(--dim);margin-top:2px;">Both pieces individually unvalidated -- ML-approved trades\' real exit vs. the step-trail mechanism\'s own hypothetical exit. Directional only, not a basis for anything yet.</div>' +
      '<div style="font-size:12px;margin-top:4px;">Normal exit: <b class="mono">' + fmtD(c.normalTotal) + '</b> &nbsp; Step-trail hypothetical: <b class="mono">' + fmtD(c.trailTotal) + '</b> &nbsp; Delta: <b class="mono" style="color:' + (delta >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (delta >= 0 ? '+' : '') + fmtD(delta) + '</b></div>';
  } catch (e) { el.innerHTML = ''; }
}

function renderMlSiloRangeTabs() {
  const el = $('ml-silo-range-tabs');
  if (!el) return;
  el.innerHTML = [['today', 'Today'], ['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['all', 'All']].map(([val, label]) =>
    '<button class="range-btn ' + (mlSiloRange === val ? 'active' : '') + '" data-ml-range="' + val + '">' + label + '</button>'
  ).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadMlSiloRange(b.dataset.mlRange)));
}

async function loadMlSiloRange(range) {
  mlSiloRange = range;
  renderMlSiloRangeTabs();
  const statsEl = $('ml-silo-all-stats');
  if (statsEl) statsEl.innerHTML = '<span style="color:var(--dim);">Loading…</span>';
  try {
    const data = await fetch('/api/ml-silo/range-trades?range=' + range + '&sample=test').then(r => r.json());
    mlSiloTradesCache = data?.trades || [];
    const modelEl = $('ml-silo-model-line');
    if (modelEl) modelEl.textContent = data?.modelVersion ? data.modelVersion + ' (out-of-sample)' : 'No trained model yet.';
    const labelEl = $('ml-silo-range-label');
    if (labelEl) labelEl.textContent = data?.rangeLabel ? data.rangeLabel + ' — ' + mlSiloTradesCache.length + ' scored candidate' + (mlSiloTradesCache.length === 1 ? '' : 's') + ' (RTH only, matches Performance)' : '';
    renderMlSiloRangeView();
  } catch (e) {
    if (statsEl) statsEl.textContent = 'Failed to load.';
  }
}

// Deliberately does NOT filter is_cluster_primary -- see getRangeTrades()'s own header
// comment (mlSiloService.js) for why: each level in a cluster is its own scored candidate
// here, unlike the main Performance section's account-level totals.
function computeMlRangeStats(trades) {
  const decided = trades.filter(t => t.actual_pnl != null).slice().sort((a, b) => (a.fired_at_str || '').localeCompare(b.fired_at_str || ''));
  let running = 0, peak = 0, maxDD = 0, worstTrade = 0;
  let wins = 0, losses = 0;
  for (const t of decided) {
    const pnl = parseFloat(t.actual_pnl);
    running += pnl;
    if (isWinRow(t)) wins++; else if (isLossRow(t)) losses++;
    if (pnl < worstTrade) worstTrade = pnl;
    if (running > peak) peak = running;
    const dd = peak - running;
    if (dd > maxDD) maxDD = dd;
  }
  const netPnl = running;
  const commission = decided.length * COMMISSION_PER_TRADE;
  const grossPnl = netPnl + commission;
  return { n: decided.length, wins, losses, netPnl, grossPnl, commission, maxDD, worstTrade, decided };
}

function renderMlStatsRow(containerId, trades) {
  const el = $(containerId);
  if (!el) return;
  const s = computeMlRangeStats(trades);
  if (s.n === 0) { el.innerHTML = '<span style="color:var(--dim);">No scored candidates in this range.</span>'; return; }
  const clr = (v) => v >= 0 ? 'var(--green)' : 'var(--red)';
  el.innerHTML =
    '<span>Wins <b class="mono" style="color:var(--green)">' + s.wins + '</b></span>' +
    '<span>Losses <b class="mono" style="color:var(--red)">' + s.losses + '</b></span>' +
    '<span>Net <b class="mono" style="color:' + clr(s.netPnl) + '">' + (s.netPnl >= 0 ? '+' : '') + '$' + s.netPnl.toFixed(0) + '</b></span>' +
    '<span title="Before commission">Gross <b class="mono" style="color:var(--muted)">' + (s.grossPnl >= 0 ? '+' : '') + '$' + s.grossPnl.toFixed(0) + '</b></span>' +
    '<span title="$' + COMMISSION_PER_TRADE + '/round-trip x ' + s.n + '">Comm <b class="mono" style="color:var(--dim)">-$' + s.commission.toFixed(0) + '</b></span>' +
    '<span title="Worst single realized trade P&L in this range">Worst <b class="mono" style="color:' + (s.worstTrade < 0 ? 'var(--red)' : 'var(--dim)') + '">' + (s.worstTrade < 0 ? '-$' + Math.abs(s.worstTrade).toFixed(0) : '$0') + '</b></span>';
}

// Two-line equity curve (All Trades vs ML-Approved), built from raw per-trade points --
// same x-axis time/date convention as the main Performance section's renderEquityCurve()
// (today shows times, everything else shows dates via fmtAxisTime()).
function renderMlSiloRangeEquityChart(canvasId, allTrades, takeTrades, range) {
  const canvas = $(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const allDecided = computeMlRangeStats(allTrades).decided;
  const takeDecided = computeMlRangeStats(takeTrades).decided;
  if (allDecided.length < 2) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Not enough resolved candidates in this range', w / 2, h / 2);
    return;
  }

  const cumulate = (rows) => {
    let running = 0;
    const points = [0], times = [rows[0]?.fired_at_str];
    for (const t of rows) { running += parseFloat(t.actual_pnl); points.push(running); times.push(t.fired_at_str); }
    return { points, times };
  };
  const allSeries = cumulate(allDecided);
  const takeSeries = cumulate(takeDecided);

  const min = Math.min(0, ...allSeries.points, ...takeSeries.points), max = Math.max(0, ...allSeries.points, ...takeSeries.points);
  const valRange = (max - min) || 1;
  const padL = 50, padR = 8, padT = 20, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const yAt = (v) => padT + plotH - ((v - min) / valRange) * plotH;

  ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(padL, yAt(0)); ctx.lineTo(w - padR, yAt(0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '10px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(148,163,184,0.75)';
  ctx.fillText('$0', padL - 6, yAt(0) + 3);
  ctx.fillText(fmtAxisMoney(max), padL - 6, yAt(max) + 3);
  ctx.fillText(fmtAxisMoney(min), padL - 6, yAt(min) + 3);

  const useTime = range === 'today';
  const drawLine = (series, color) => {
    if (series.points.length < 2) return;
    const xAt = (i) => padL + (i / (series.points.length - 1)) * plotW;
    ctx.beginPath();
    series.points.forEach((v, i) => { const x = xAt(i), y = yAt(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    // x-axis labels for this line's own timestamps (both series share the same range window)
    const xTickCount = Math.min(5, series.points.length);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(148,163,184,0.75)'; ctx.font = '10px monospace';
    for (let k = 0; k < xTickCount; k++) {
      const idx = xTickCount === 1 ? 0 : Math.round((k / (xTickCount - 1)) * (series.points.length - 1));
      const x = xAt(idx);
      ctx.fillText(fmtAxisTime(series.times[idx], useTime), Math.min(Math.max(x, padL + 20), w - padR - 20), h - 4);
    }
  };
  drawLine(allSeries, '#3b82f6');
  drawLine(takeSeries, '#c4b5fd');

  ctx.textAlign = 'left'; ctx.font = '10px monospace';
  ctx.fillStyle = '#3b82f6'; ctx.fillText('● All Trades', padL, 12);
  ctx.fillStyle = '#c4b5fd'; ctx.fillText('● ML-Approved', padL + 70, 12);
}

function todayET() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

// Current session's own trade_date -- mirrors server/routes/acd.js's nextTradingDay() +
// /api/setups/today-summary's currentSessionDate logic exactly. FIXED 2026-08-09: the
// Session Timeline used to show BOTH today's RTH trade_date AND (once >=6PM ET) the next
// session's trade_date simultaneously (that's /api/setups/today's own, deliberately wider,
// "today + tomorrow" contract -- still correct for that endpoint's other use), so from 6PM
// until local midnight the timeline kept accumulating the day that had already closed
// instead of resetting the moment the new Globex session opened. User-reported: "the trades
// dont reset from the trade day... they keep going until midnight... should reset at the
// 6pm est globex start." Fixed by filtering client-side to ONE trade_date -- the session
// that's actually open right now -- rather than changing /api/setups/today's contract
// (only this page consumes it; grepped 2026-08-09, confirmed the only caller).
function nextTradingDayET(nowET) {
  const d = new Date(nowET);
  d.setDate(d.getDate() + 1);
  if (d.getDay() === 0) d.setDate(d.getDate() + 1); // Sun -> Mon
  if (d.getDay() === 6) d.setDate(d.getDate() + 2); // Sat -> Mon
  return d.toLocaleDateString('en-CA');
}
function currentSessionDateET() {
  const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  return nowET.getHours() >= 18 ? nextTradingDayET(nowET) : todayET();
}

function renderPulseBar(pulse, setupData, ctx, build) {
  if (!pulse || pulse.error) return;
  const chips = [];

  const fromOpenStr = pulse.ptsFromOpen != null ? fmtPct(pulse.ptsFromOpen.toFixed(0)) + 'pt' : '—';
  // KEEP IN SYNC with MarketPulseBar.jsx's fromOpenClr/moveColor/deltaColor/rvolColor -- same
  // rangeClass/deltaClass/rvolSigma -> color mappings, duplicated because this is a standalone
  // page that can't import that module. Token names below deliberately match C.muted/C.dim
  // usage there, NOT this file's own --muted/--dim naming intuition -- verify against
  // MarketPulseBar.jsx directly before changing either.
  const fromOpenClr = pulse.ptsFromOpen == null ? 'var(--muted)' : pulse.ptsFromOpen > 0 ? 'var(--green)' : pulse.ptsFromOpen < 0 ? 'var(--red)' : 'var(--muted)';
  chips.push(chip('NQ', pulse.currentPrice ? pulse.currentPrice.toFixed(2) : '—', fromOpenStr, fromOpenClr, 'var(--text)'));

  const moveColor = pulse.rangeClass === 'EXTENDED' ? 'var(--red)' : pulse.rangeClass === 'QUIET' ? 'var(--muted)' : 'var(--amber)';
  const rangeLabel = pulse.rangeClass === 'EXTENDED' ? 'BIG' : pulse.rangeClass === 'QUIET' ? 'QUIET' : 'NORMAL';
  chips.push(chip('Range', pulse.sessionRange ? pulse.sessionRange.toFixed(0) + 'pt' : '—', rangeLabel, moveColor, moveColor));

  const deltaColor = pulse.deltaClass === 'HIGH' ? (pulse.deltaSign === 'BUYING' ? 'var(--green)' : 'var(--red)') : 'var(--dim)';
  const deltaArrow = pulse.deltaSign === 'BUYING' ? '▲' : pulse.deltaSign === 'SELLING' ? '▼' : '—';
  chips.push(chip('CumΔ', pulse.sessionDelta != null ? deltaArrow + ' ' + Math.abs(pulse.sessionDelta).toLocaleString() : '—', pulse.deltaClass !== 'NORMAL' ? pulse.deltaClass : '', deltaColor, deltaColor));

  if (pulse.rvol != null) {
    const rvolColor = pulse.rvolSigma >= 2 ? 'var(--red)' : pulse.rvolSigma >= 1 ? 'var(--amber)' : pulse.rvolSigma < -0.5 ? 'var(--muted)' : 'var(--dim)';
    const rvolLabel = pulse.rvolSigma >= 2 ? 'EXTREME' : pulse.rvolSigma >= 1 ? 'SPIKE' : '';
    chips.push(chip('RVol', pulse.rvol.toFixed(1) + '×', rvolLabel, rvolColor, rvolColor));
  }

  // Size chip
  // standDown (loss-streak SKIP trigger) removed server-side 2026-09-05 -- refuted premise, see
  // acd.js's sizeFactorsAtDetection comment.
  // FIXED 2026-09-07 (mirrors the identical fix in src/components/dashboard/MarketPulseBar.jsx's
  // SizeChip -- keep both in sync, this file duplicates that component's formula): removed the
  // Math.max(1, ...) floor that forced every non-zero multiplier up to at least 1 contract,
  // which made this chip always show "1 ct" for a base=1 trader regardless of real conviction.
  // SKIP is now derived from the actual rounded recommendation (rec===0), not a literal
  // mult===0 check the sizeMultiplier IIFE's documented 0.10-1.5 range never reaches.
  const setup = setupData?.setup && !setupData.setup.isExpired ? setupData.setup : null;
  const mult = setup?.sizeMultiplier ?? null;
  if (setup != null && mult !== null) {
    const base = parseInt(localStorage.getItem('baseContracts') || '2');
    const rec = Math.round(base * mult);
    const vColor = rec === 0 ? 'var(--red)' : mult >= 1.1 ? 'var(--green)' : mult >= 0.85 ? '#60a5fa' : mult >= 0.5 ? 'var(--amber)' : '#f97316';
    chips.push(chip('Size', base + ' → ' + (rec === 0 ? 'SKIP' : rec + ' ct'), '(' + mult.toFixed(2) + '×)', vColor, vColor));
  }

  if (ctx && !ctx.noData) {
    if (ctx.sessionChar) {
      const cc = ctx.sessionChar === 'EXTREME_CHOP' ? 'var(--red)' : ctx.sessionChar === 'CHOP' ? 'var(--amber)' : ctx.sessionChar.includes('TREND') ? 'var(--green)' : 'var(--dim)';
      chips.push(chip('Session', ctx.sessionChar.replace(/_/g, ' '), 'tap for history', cc, cc, 'openSessionTrendHistoryModal()'));
    }
    if (ctx.dailyVwapSigma != null) {
      const clr = sigmaColor(ctx.dailyVwapSigma);
      chips.push(chip('RVWAP', fmtPct(ctx.dailyVwapSigma) + 'σ', '', clr, clr));
    }
    if (ctx.vwap24Sigma != null) {
      const clr = sigmaColor(ctx.vwap24Sigma);
      chips.push(chip('24H', fmtPct(ctx.vwap24Sigma) + 'σ', '', clr, clr));
    }
    if (ctx.weeklyVwapSigma != null) {
      const clr = sigmaColor(ctx.weeklyVwapSigma);
      chips.push(chip('WK VWAP', fmtPct(ctx.weeklyVwapSigma) + 'σ', '', clr, clr));
    }
  }

  // Volume-building expansion gauge (RESEARCH_CLAIM volume_building_no_level_initiative_test /
  // momentum_feeds_momentum_robust_across_daytype, 2026-08-29). Non-directional by design —
  // predicts a bigger move is coming, not which way, so this deliberately shows no arrow/sign.
  if (build && build.bucket) {
    const bucketColor = { VERY_QUIET: 'var(--dim)', QUIET: 'var(--dim)', NORMAL: 'var(--muted)', ELEVATED: 'var(--amber)', HIGH: 'var(--red)' }[build.bucket] || 'var(--muted)';
    const bucketLabel = { VERY_QUIET: 'QUIET', QUIET: 'QUIET', NORMAL: 'NORMAL', ELEVATED: 'ELEV', HIGH: 'HIGH' }[build.bucket] || build.bucket;
    const momSub = build.momentumContext === 'ACTIVE' ? 'on active base' : build.momentumContext === 'QUIET' ? 'from quiet base' : '';
    chips.push(chip('Expand', bucketLabel, momSub, bucketColor, bucketColor));
  }

  $('pulse-bar').innerHTML = chips.join('');
}

function chip(label, val, sub, subColor, valColor, onclick) {
  // onclick (optional, 2026-09-15, session-trend-history feature): only the Session chip
  // passes this today -- every other existing call site is unaffected (undefined onclick
  // renders identically to before). Cursor/tap-target styling only applied when clickable so
  // a plain informational chip doesn't look interactive.
  return '<div class="chip"' + (onclick ? ' style="cursor:pointer" onclick="' + onclick + '"' : '') + '><span class="lbl">' + label + '</span>' +
    '<span class="val mono" style="color:' + (valColor || 'var(--text)') + '">' + val + '</span>' +
    (sub ? '<span class="sub" style="color:' + subColor + '">' + sub + '</span>' : '') +
    '</div>';

// ---- Active setup card ----
function renderSetupCard(setupData) {
  const el = $('setup-card');
  const active = setupData?.setup && !setupData.setup.isExpired ? setupData.setup : null;
  if (!active) {
    // Hidden entirely (CSS display:none default) rather than an empty "Watching -- no setup"
    // placeholder -- matches #sweep-watch's own "stay hidden unless there's something to say"
    // convention (2026-09-16, user request).
    el.className = '';
    el.innerHTML = '';
    return;
  }
  const isLong = (active.type || '').includes('LONG') || (active.type || '').includes('BULLISH');
  // originStatus (2026-09-21) -- ACTIVE means this was actually shown as a real live alert
  // at fire time; anything else (SHADOW/BACKFILL/UNKNOWN/null) is background-tracked only,
  // most commonly a deliberately-suppressed setup_type (e.g. IB_BULLISH/IB_BEARISH, killed
  // 2026-08-31) still generating candidates the priority-selection array evaluates every
  // poll. Never let this render identically to a real ACTIVE fire.
  const isShadowOnly = active.originStatus != null && active.originStatus !== 'ACTIVE';
  el.className = (isShadowOnly ? 'shadow-only' : (isLong ? 'long' : 'short')) + ' visible';
  const color = isShadowOnly ? 'var(--amber)' : (isLong ? 'var(--green)' : 'var(--red)');
  const rr = (active.entry && active.stop && active.target && Math.abs(active.entry - active.stop) > 0)
    ? (Math.abs(active.target - active.entry) / Math.abs(active.entry - active.stop)).toFixed(1) : null;

  let html = '<div class="setup-head">';
  html += '<span class="dot" style="background:' + color + (active.minsRemaining != null && active.minsRemaining <= 0 ? ';animation:none' : '') + '"></span>';
  html += '<span class="setup-type" style="color:' + color + '">' + (active.type || '').replace(/_/g, ' ') + '</span>';
  if (isShadowOnly) html += '<span class="setup-shadow-tag" title="' + (active.suppressionReason || 'background-tracked') + '">BACKGROUND ONLY — NOT LIVE</span>';
  html += '<span class="setup-time mono">fired ' + (active.detectedAt || '') + ' ET</span>';
  html += '</div>';
  html += '<div class="setup-grid">';
  if (active.entry != null)  html += '<span class="k">Entry <b class="mono" style="color:var(--text)">' + Math.round(active.entry) + '</b></span>';
  if (active.stop != null)   html += '<span class="k">Stop <b class="mono" style="color:var(--red)">' + Math.round(active.stop) + '</b></span>';
  if (active.target != null) html += '<span class="k">T1 <b class="mono" style="color:var(--green)">' + Math.round(active.target) + '</b></span>';
  if (rr != null)             html += '<span class="k">R:R <b class="mono" style="color:#cbd5e1">' + rr + '</b></span>';
  // Real historical count (origin_status ACTIVE/SHADOW only, excludes synthetic BACKFILL --
  // CLAUDE.md hard rule) for this exact setup_type, from performance_audit SETUP_STATUS via
  // getCanonicalLiveStatus() (2026-09-14, user request). N<20 colored amber -- this codebase's
  // own standing floor before a WR/EV claim is decisive; still shown, just flagged as thin.
  if (active.realN != null) {
    const nColor = active.realN < 20 ? 'var(--amber)' : '#cbd5e1';
    html += '<span class="k">N <b class="mono" style="color:' + nColor + '">' + active.realN + '</b></span>';
  }
  html += '</div>';
  if (active.minsRemaining != null) {
    html += '<div class="setup-mins" style="color:' + (active.minsRemaining < 10 ? 'var(--amber)' : 'var(--dim)') + '">' + active.minsRemaining + 'm remaining</div>';
  }
  el.innerHTML = html;
}

// ---- Session timeline ----
// COMMISSION/PNL_PER_POINT match server/routes/acd.js's live resolution constants exactly
// (CLAUDE.md hard rule: this journal trades MNQ, $2/pt, $2 round-trip commission / $1 per
// side -- never copy a different $/pt or commission constant; ground truth is
// server/config/instruments.js's LIVE_INSTRUMENT.commissionPerRoundTrip, imported by
// acd.js's own resolution paths as `COMMISSION`). actual_pnl is already NET of commission
// (every resolution path subtracts COMMISSION before storing it) -- "commission spent" and
// "gross P&L" below are both DERIVED from that stored net figure, not separately fetched.
// FIXED 2026-08-13: this was still 1, left over from before the 2026-08-11 commission
// correction (server/config/instruments.js's own comment: "$1 per transaction per contract
// -- entry + exit = $2 round-trip -- the prior value was wrong despite an earlier note
// claiming broker-statement verification"). This file never got updated when that fix
// shipped -- every "commission spent"/"gross P&L" figure on this page was silently
// undercounting commission by $1/trade since 2026-08-11, caught via direct user report
// ("commission in live is still $1... should be $2 round trip").
const COMMISSION_PER_TRADE = 2;

// Win/loss classification (2026-09-02, user-caught bug): TARGET_HIT/STOP_HIT string equality
// alone silently missed TRAIL_EXIT (the breakeven-trail mechanism, CLAUDE.md's "Breakeven-
// then-trail single-position exit mechanism") -- those rows fell through every badge/tally
// branch to a neutral '—'/uncounted even though actual_pnl was correctly positive. TRAIL_EXIT
// is a genuinely decisive outcome (T1 was reached, then trailed further -- not an ambiguous
// time-based cutoff), so it belongs in the win/loss tally; classified by its own P&L sign since
// a trail can in principle close at breakeven-or-worse. Deliberately NOT extended to
// TIME_EXPIRED/INVALIDATED/SESSION_CLOSED -- those stay excluded from win/loss by design (see
// computeRangeStats below and the OPEN_THREADS "decisive outcomes only" convention), this only
// closes the gap for the one resolution type that should have been decisive all along.
function isWinRow(s) {
  if (s.resolution === 'TARGET_HIT') return true;
  if (s.resolution === 'TRAIL_EXIT') return s.actual_pnl != null && parseFloat(s.actual_pnl) >= 0;
  return false;
}
function isLossRow(s) {
  if (s.resolution === 'STOP_HIT') return true;
  if (s.resolution === 'TRAIL_EXIT') return s.actual_pnl != null && parseFloat(s.actual_pnl) < 0;
  return false;
}

let timelineRows = []; // full setup rows (already session+filter scoped), keyed for the modal lookup
let allTimelineRows = []; // unfiltered fetch, so toggling live/all doesn't require a re-fetch
let timelineFilter = localStorage.getItem('timelineFilter') || 'live'; // 'live' | 'all'
// Top-5-by-$-impact tag filter (2026-09-16, user request: replaced the Vol Building filter --
// "add filters in the same spot, one for each of the top 5 tags that save us the most pnl").
// Purely a client-side display filter on the already-fetched rows, same as the Vol Building
// filter it replaces -- changing this NEVER affects what fires. TAG_META's `test` predicates
// mirror server/routes/setups.js's loss-prevention-summary gateStat/altExitStat flag checks
// EXACTLY (same field paths, same conditions) so a row counted as "flagged" server-side for the
// $ ranking is counted identically client-side for the filter -- see that endpoint if either
// side ever needs to change, and change both together.
const TAG_META = {
  dirGate:        { label: 'DG',  test: s => s.direction_gate_shadow?.wouldBeBlocked === true },
  momFade:        { label: 'MF',  test: s => s.momentum_against_fade_shadow?.against === true },
  stepTrail:      { label: 'ST',  test: s => s.step_trail_shadow?.hypothetical_pnl != null },
  pitchCatch:     { label: 'PC',  test: s => s.pitch_catch_shadow?.qualified === true && s.pitch_catch_shadow?.hypothetical_pnl != null },
  rangeSlope:     { label: 'RS',  test: s => s.post_entry_exit_signals?.range_slope?.hypothetical_pnl != null },
  volRollover:    { label: 'VR',  test: s => s.post_entry_exit_signals?.vol_rollover?.hypothetical_pnl != null },
  breakevenStop:  { label: 'BS',  test: s => s.breakeven_stop_shadow?.classification === 'REWARDED' && s.breakeven_stop_shadow?.hypothetical_pnl != null },
  entryFlowLong:  { label: 'EFL', test: s => s.entry_orderflow_shadow?.rule === 'LONG_REPEAT_ADVERSE_FLOW' && s.entry_orderflow_shadow?.wouldBeFlagged === true },
  entryFlowShort: { label: 'EFS', test: s => s.entry_orderflow_shadow?.rule === 'SHORT_MORNING_ADVERSE_FLOW' && s.entry_orderflow_shadow?.wouldBeFlagged === true },
};
let tagFilter = localStorage.getItem('tagFilter') || 'all'; // 'all' | one of TAG_META's keys
let topTagKeys = []; // populated by loadTagRanking(), ranked by real $ lossPrevented (today), top 5
function setTagFilter(f) {
  tagFilter = f;
  localStorage.setItem('tagFilter', f);
  loadTimeline();
}
// Ranks by TODAY's lossPrevented (user request, 2026-09-16 -- was YTD, switched same day) --
// the real-tier/thin-tier N split below already absorbs most of the "can jump around on thin
// same-day N" risk this was originally guarding against.
async function loadTagRanking() {
  try {
    const data = await fetch('/api/setups/loss-prevention-summary').then(r => r.json());
    const todayStats = data.mechanisms?.today || {};
    // Sort real (N>=20, this codebase's own "never fabricate a stat" floor) mechanisms ahead of
    // thin ones, ranked by lossPrevented within that real tier -- but within the THIN (N<20)
    // tier, rank by N instead of lossPrevented. Found live 2026-09-16 (user: "I dont see EFS
    // there are alot of EFS tags"): a plain lossPrevented sort let RangeSlope's $531 (from just
    // N=2 trades) edge out EntryFlow-S's $503 (N=16) -- a 2-trade total swings wildly and isn't
    // more real just because it happens to currently add up slightly higher; a first attempt at
    // this fix that only split real-vs-thin but still sorted the thin tier by $ made the exact
    // same mistake one level down and didn't actually change the outcome (verified before
    // shipping, not assumed). Ranking the thin tier by N instead means "more data, even if not
    // yet enough" beats "less data that happens to sum higher."
    topTagKeys = Object.entries(todayStats)
      .filter(([key, s]) => TAG_META[key] && s.n > 0)
      .sort((a, b) => {
        const aReal = a[1].n >= 20, bReal = b[1].n >= 20;
        if (aReal !== bReal) return (bReal ? 1 : 0) - (aReal ? 1 : 0);
        return aReal ? b[1].lossPrevented - a[1].lossPrevented : b[1].n - a[1].n;
      })
      .slice(0, 5)
      .map(([key]) => key);
  } catch (e) { /* keep whatever was there (empty on first load -> no filter row shown yet) */ }
  loadTimeline();
}
